<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Gerencie convites de acesso à equipe SmartInspect AI">
<title>Convites da equipe - SmartInspect AI</title>
<link rel="icon" type="image/png" href="../imagens/favicon.png">
<link rel="stylesheet" href="../css/style.css">
<style>
.erp-page--convites .invite-page{max-width:1100px;margin:0 auto;padding:34px 24px 56px}
.erp-page--convites .invite-heading{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}
.erp-page--convites .invite-heading h1{margin:0 0 8px;color:#fff;font-size:clamp(25px,4vw,34px)}
.erp-page--convites .invite-heading p{margin:0;color:#9bb0c5;line-height:1.6}
.erp-page--convites .invite-heading-icon{display:grid;place-items:center;width:42px;height:42px;flex:0 0 42px;border:1px solid rgba(92,236,255,.25);border-radius:13px;color:#5cecff;background:rgba(92,236,255,.08)}
.erp-page--convites .invite-heading-icon svg{display:block;width:20px;height:20px;max-width:100%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.erp-page--convites .invite-panel{margin:18px 0;padding:24px;border:1px solid rgba(133,216,255,.16);border-radius:18px;background:linear-gradient(145deg,rgba(18,42,72,.84),rgba(7,18,35,.88));box-shadow:0 18px 48px rgba(0,0,0,.2)}
.erp-page--convites .invite-panel h2{margin:0 0 7px;color:#f4fbff;font-size:19px}
.erp-page--convites .invite-panel>p{margin:0 0 18px;color:#91a8bd;font-size:13px;line-height:1.65}
.erp-page--convites .invite-form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
.erp-page--convites .invite-form label{display:grid;gap:8px;color:#d7e9f5;font-size:12px;font-weight:700}
.erp-page--convites .invite-form input{height:46px;min-width:0;padding:0 13px;border:1px solid rgba(133,216,255,.22);border-radius:10px;color:#fff;background:rgba(3,11,23,.65)}
.erp-page--convites .invite-form input:focus{outline:2px solid rgba(92,236,255,.35);border-color:#5cecff}
.erp-page--convites .invite-form button{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:46px;padding:0 17px;border:0;border-radius:10px;color:#03111d;font-weight:800;background:linear-gradient(135deg,#5cecff,#42bfff);cursor:pointer}
.erp-page--convites .invite-form button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.erp-page--convites .invite-form button:disabled{opacity:.6;cursor:wait}
.erp-page--convites .invite-status{min-height:18px;margin:12px 0 0;color:#a9efd0;font-size:12px}
.erp-page--convites .invite-status.is-error{color:#ffadb6}
.erp-page--convites .invite-note{margin:0 0 16px;color:#91a8bd;font-size:12px;line-height:1.6}
.erp-page--convites .invite-list{display:grid;gap:10px}
.erp-page--convites .invite-card{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 16px;border:1px solid rgba(133,216,255,.14);border-radius:13px;background:rgba(255,255,255,.035)}
.erp-page--convites .invite-copy{display:grid;gap:5px;min-width:0}.erp-page--convites .invite-copy strong{color:#f4fbff;overflow-wrap:anywhere}.erp-page--convites .invite-copy span,.erp-page--convites .invite-empty{color:#91a8bd;font-size:12px}
.erp-page--convites .invite-state{flex:0 0 auto;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:700}.erp-page--convites .invite-state.pending{color:#ffdc93;background:rgba(255,196,77,.1)}.erp-page--convites .invite-state.done{color:#a9efd0;background:rgba(53,229,138,.1)}
@media(max-width:620px){.erp-page--convites .invite-page{padding:25px 16px 42px}.erp-page--convites .invite-panel{padding:18px}.erp-page--convites .invite-form{grid-template-columns:1fr}.erp-page--convites .invite-form button{width:100%}.erp-page--convites .invite-card{align-items:flex-start;flex-direction:column}.erp-page--convites .invite-heading-icon{width:38px;height:38px;flex-basis:38px}.erp-page--convites .invite-heading-icon svg{width:18px;height:18px}}
</style>
</head>
<body class="erp-page--convites">
<div class="menu-container"></div>
<main class="invite-page">
  <header class="invite-heading"><div><p class="eyebrow">EQUIPE E ACESSO</p><h1>Convites da empresa</h1><p>Convide pessoas para acessar este ambiente e acompanhe os convites enviados.</p></div><span class="invite-heading-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M10 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM20 8v6M23 11h-6"></path></svg></span></header>
  <section class="invite-panel" aria-labelledby="inviteTitle"><h2 id="inviteTitle">Convidar uma pessoa</h2><p id="erpInviteAccessNote">Verificando suas permissões…</p><form id="erpInviteForm" class="invite-form"><label for="erpInviteEmail">E-mail usado no SmartInspect<input id="erpInviteEmail" type="email" autocomplete="email" maxlength="254" placeholder="nome@empresa.com.br" required></label><button type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Enviar convite</button></form><p id="erpInviteStatus" class="invite-status" role="status" aria-live="polite"></p></section>
  <section class="invite-panel" aria-labelledby="sentInvitesTitle"><h2 id="sentInvitesTitle">Convites enviados</h2><p class="invite-note">O convite aparecerá no painel pessoal da pessoa quando ela entrar com o e-mail informado.</p><div id="erpInviteList" class="invite-list" aria-live="polite"><p class="invite-empty">Carregando convites…</p></div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/sidebar.js"></script>
<script src="../js/convites-empresa.js"></script>
</body>
</html>
