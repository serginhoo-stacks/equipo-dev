<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP da Empresa — SmartInspect AI</title>
    <link rel="icon" href="imagens/favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { display: flex; height: 100vh; background: #050b18; color: white; overflow: hidden; }
        
        /* Sidebar do Projeto Novo (Apenas visual, para dar contexto) */
        .nav-nova { 
            width: 70px; 
            background: #081426; 
            border-right: 1px solid rgba(133,216,255,.14); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px 0; 
            gap: 20px; 
            flex-shrink: 0;
        }
        .nav-nova img { width: 40px; height: 40px; border-radius: 10px; margin-bottom: 10px; }
        .nav-btn { 
            width: 44px; height: 44px; border-radius: 12px; border: 1px solid transparent; 
            background: rgba(255,255,255,.05); color: #91a8bd; cursor: pointer; 
            display: grid; place-items: center; transition: .2s; font-size: 18px;
        }
        .nav-btn:hover, .nav-btn.active { background: rgba(92,236,255,.1); color: #5cecff; border-color: rgba(92,236,255,.3); }

        /* Área do ERP Antigo */
        .erp-container { flex: 1; display: flex; flex-direction: column; background: #fff; }
        .erp-header { 
            padding: 12px 20px; 
            background: #f5f8fc; 
            border-bottom: 1px solid #e5edf5; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-shrink: 0;
        }
        .erp-header h2 { color: #102a43; font-size: 16px; margin: 0; }
        .btn-voltar { 
            padding: 8px 16px; background: #c53b3b; color: white; border: none; 
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; 
            transition: 0.2s;
        }
        .btn-voltar:hover { background: #a12f2f; }
        
        /* O iframe que carrega o dashboard antigo */
        iframe { flex: 1; width: 100%; height: 100%; border: none; }
        
        /* Tela de erro (se o caminho estiver errado) */
        .erro-load { 
            display: none; flex-direction: column; align-items: center; justify-content: center; 
            height: 100%; color: #102a43; text-align: center; padding: 20px;
        }
        .erro-load h3 { font-size: 24px; margin-bottom: 10px; }
        .erro-load p { color: #667085; margin-bottom: 20px; }
    </style>
</head>
<body>

    <!-- Sidebar do Usuário (Projeto Novo) -->
    <aside class="nav-nova">
        <img src="imagens/logo.png" alt="Logo">
        <button class="nav-btn" title="Voltar ao Painel Pessoal" onclick="window.location.href='login.html'">🏠</button>
        <button class="nav-btn active" title="ERP da Empresa">🏢</button>
    </aside>

    <!-- Container do ERP -->
    <main class="erp-container">
        <header class="erp-header">
            <h2 id="nomeEmpresaHeader">Carregando empresa...</h2>
            <button class="btn-voltar" onclick="window.location.href='login.html'">Sair da Empresa</button>
        </header>
        
        <!-- O IFrame apontando para a pasta ERP -->
        <iframe id="iframeERP" src="erp/dashboard.html" title="ERP da Empresa" onload="esconderErro()" onerror="mostrarErro()"></iframe>
        
        <!-- Bloco de erro caso o caminho esteja errado -->
        <div id="erroBox" class="erro-load">
            <h3>Ops! O ERP não foi encontrado.</h3>
            <p>O arquivo <strong>erp/dashboard.html</strong> não existe ou está em outro lugar.</p>
            <p style="font-size:13px;">Verifique se dentro da pasta `erp` tem o arquivo `dashboard.html`.</p>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script>
        function esconderErro() { document.getElementById('erroBox').style.display = 'none'; }
        function mostrarErro() { document.getElementById('erroBox').style.display = 'flex'; }

        document.addEventListener("DOMContentLoaded", async () => {
            // Pega o ID da empresa na URL: empresa.html?empresa=123
            const urlParams = new URLSearchParams(window.location.search);
            const empresaId = urlParams.get('empresa');

            if (!empresaId) {
                document.getElementById('nomeEmpresaHeader').textContent = "Empresa não identificada";
                return;
            }

            // Busca o nome da empresa no Supabase para ficar bonito no topo
            if(window.banco) {
                const { data, error } = await window.banco.from('empresas').select('nome').eq('id', empresaId).single();
                
                if (data && !error) {
                    document.getElementById('nomeEmpresaHeader').textContent = data.nome;
                    // Passa o ID da empresa para dentro do iframe
                    document.getElementById('iframeERP').src = `erp/dashboard.html?empresa=${empresaId}`;
                } else {
                    document.getElementById('nomeEmpresaHeader').textContent = "Empresa sem nome";
                }
            }
        });
    </script>
</body>
</html>
