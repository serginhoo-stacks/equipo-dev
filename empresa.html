<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando para o ERP...</title>
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; background: #050b18; color: white; font-family: sans-serif; }
    </style>
</head>
<body>
    <h2>Entrando no ERP...</h2>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // 1. Verifica login
            const { data: sessionData } = await window.banco.auth.getSession();
            if (!sessionData.session) {
                window.location.href = 'login.html';
                return;
            }

            // 2. Pega o ID da empresa
            const urlParams = new URLSearchParams(window.location.search);
            const empresaId = urlParams.get('empresa');

            if (!empresaId) {
                alert("Nenhuma empresa selecionada.");
                window.location.href = 'login.html';
                return;
            }

            // 3. Redireciona direto para a lista de Obras (em vez do Dashboard)
            window.location.href = `ERP/obras.html?empresa=${empresaId}`;
        });
    </script>
</body>
</html>
