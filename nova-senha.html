<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova senha - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:Arial,sans-serif;

}

.login-background{

min-height:100vh;

display:flex;

align-items:center;

justify-content:center;

background:

linear-gradient(
rgba(0,0,0,0.65),
rgba(0,0,0,0.65)
),

url("imagens/logo.png");

background-size:cover;

background-position:center;

padding:20px;

}

.login-card{

background:white;

width:100%;

max-width:380px;

padding:40px;

border-radius:20px;

text-align:center;

box-shadow:0 10px 35px rgba(0,0,0,0.4);

}

.login-logo{

width:130px;

height:auto;

margin-bottom:15px;

}

h1{

color:#1f4e79;

margin-bottom:10px;

}

p{

color:#555;

line-height:1.5;

}

label{

display:block;

text-align:left;

margin-top:18px;

font-weight:bold;

}

input{

width:100%;

padding:13px;

margin-top:6px;

border-radius:8px;

border:1px solid #ccc;

font-size:15px;

}

input:focus{

outline:none;

border-color:#1f6feb;

box-shadow:0 0 0 2px rgba(31,111,235,.12);

}

button{

width:100%;

padding:14px;

margin-top:22px;

border:none;

border-radius:10px;

background:#1f6feb;

color:white;

font-size:16px;

cursor:pointer;

}

button:hover{

background:#1555b0;

}

.voltar{

display:block;

margin-top:18px;

color:#1f6feb;

cursor:pointer;

text-decoration:none;

}

#mensagem{

margin-top:18px;

font-weight:bold;

min-height:20px;

}

.sucesso{

color:#198754;

}

.erro{

color:#dc3545;

}

</style>

</head>


<body>


<div class="login-background">


<div class="login-card">


<img
src="imagens/logo.png"
class="login-logo"
alt="SmartInspect AI"
>


<h1>
🔐 Nova senha
</h1>


<p>

Crie uma nova senha para acessar
o SmartInspect AI.

</p>


<label>
Nova senha
</label>

<input
id="novaSenha"
type="password"
placeholder="Digite sua nova senha"
autocomplete="new-password"
>


<label>
Confirmar nova senha
</label>

<input
id="confirmarSenha"
type="password"
placeholder="Digite novamente"
autocomplete="new-password"
>


<button
id="btnAlterar"
onclick="alterarSenha()"
>

🔐 Alterar senha

</button>


<p id="mensagem"></p>


<a
class="voltar"
href="login.html"
>
← Voltar para o login
</a>


</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>


<script>


/* =====================================================
   ALTERAR SENHA
===================================================== */

async function alterarSenha(){


const senha =
document
.getElementById("novaSenha")
.value;


const confirmar =
document
.getElementById("confirmarSenha")
.value;


const mensagem =
document
.getElementById("mensagem");


const botao =
document
.getElementById("btnAlterar");


/* VALIDAR */

if(!senha || !confirmar){

mensagem.innerHTML =
"⚠️ Preencha os dois campos.";

mensagem.className="erro";

return;

}


/* TAMANHO */

if(senha.length < 6){

mensagem.innerHTML =
"⚠️ A senha deve ter pelo menos 6 caracteres.";

mensagem.className="erro";

return;

}


/* CONFIRMAÇÃO */

if(senha !== confirmar){

mensagem.innerHTML =
"❌ As senhas não são iguais.";

mensagem.className="erro";

return;

}


/* BOTÃO */

botao.disabled=true;

botao.innerHTML="⏳ Alterando...";


/* ALTERAR NO SUPABASE */

const {data,error} =
await banco.auth.updateUser({

password:senha

});


/* ERRO */

if(error){

console.error(error);

mensagem.innerHTML =
"❌ Não foi possível alterar a senha.";

mensagem.className="erro";

botao.disabled=false;

botao.innerHTML="🔐 Alterar senha";

return;

}


/* SUCESSO */

mensagem.innerHTML =
"✅ Senha alterada com sucesso!";

mensagem.className="sucesso";


/* SAIR DA SESSÃO */

await banco.auth.signOut();


/* VOLTAR PARA LOGIN */

setTimeout(()=>{

window.location.href="login.html";

},2000);


}


/* =====================================================
   VERIFICAR SESSÃO DE RECUPERAÇÃO
===================================================== */

banco.auth.getSession().then(({data})=>{

if(!data.session){

console.log(
"Nenhuma sessão de recuperação encontrada."
);

}

});


</script>


</body>

</html>
