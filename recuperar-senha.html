<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b18">
  <title>Recuperar senha | SmartInspect</title>

  <!-- Ajuste o caminho caso seu favicon esteja em outra pasta. -->
  <link rel="icon" href="../imagens/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="../imagens/favicon.png">

  <!-- Folha de estilos compartilhada do projeto. -->
  <link rel="stylesheet" href="../css/style.css">

  <style>
    :root {
      --bg: #050b18;
      --bg2: #081426;
      --border: rgba(133, 216, 255, .18);
      --cyan: #5cecff;
      --blue: #229dff;
      --text: #e7f5ff;
      --muted: #91a8bd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--text);
      font: 14px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 10% 0, rgba(34,157,255,.18), transparent 28rem),
        radial-gradient(circle at 90% 65%, rgba(155,124,255,.16), transparent 30rem),
        linear-gradient(135deg, var(--bg), var(--bg2) 55%, #050b18);
    }
    .recovery-card {
      width: min(100%, 440px);
      padding: clamp(25px, 7vw, 42px);
      border: 1px solid var(--border);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(18,42,72,.88), rgba(7,18,35,.9));
      box-shadow: 0 25px 75px rgba(0,0,0,.38), inset 0 1px rgba(255,255,255,.06);
      backdrop-filter: blur(18px);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 750;
      letter-spacing: -.4px;
    }
    .brand-mark {
      display: grid;
      width: 44px;
      height: 44px;
      overflow: hidden;
      place-items: center;
      border: 1px solid rgba(92,236,255,.34);
      border-radius: 13px;
      background: rgba(92,236,255,.1);
      box-shadow: 0 0 24px rgba(92,236,255,.12);
    }
    .brand-mark img { width: 100%; height: 100%; object-fit: contain; }
    .brand b { color: var(--cyan); }
    .eyebrow { margin: 32px 0 9px; color: var(--cyan); font-size: 10px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; color: #fff; font-family: "Space Grotesk", Inter, sans-serif; font-size: clamp(28px, 7vw, 36px); letter-spacing: -.055em; }
    .description { margin: 12px 0 25px; color: var(--muted); line-height: 1.7; }
    label { display: block; margin-bottom: 8px; color: #d7e9f5; font-size: 12px; font-weight: 700; }
    input {
      width: 100%;
      height: 48px;
      padding: 0 13px;
      border: 1px solid rgba(133,216,255,.2);
      border-radius: 11px;
      outline: 0;
      color: #fff;
      background: rgba(3,11,23,.62);
      font: inherit;
      transition: border-color .2s, box-shadow .2s;
    }
    input::placeholder { color: #71879c; }
    input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(92,236,255,.1); }
    .submit-button {
      width: 100%;
      min-height: 46px;
      margin-top: 17px;
      border: 0;
      border-radius: 11px;
      color: #03111d;
      background: linear-gradient(135deg, var(--cyan), #42bfff);
      box-shadow: 0 9px 24px rgba(92,236,255,.13);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    .submit-button:hover { transform: translateY(-2px); box-shadow: 0 13px 30px rgba(92,236,255,.24); }
    .submit-button:focus-visible, .back-link:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
    .feedback { min-height: 20px; margin: 14px 0 0; color: #a7f4c8; font-size: 12px; line-height: 1.6; }
    .feedback.error { color: #ffb5bc; }
    .back-link { display: inline-flex; margin-top: 17px; color: #dffaff; font-size: 12px; text-decoration: none; }
    .back-link:hover { color: var(--cyan); }
    @media (max-width: 480px) { body { padding: 16px; } .recovery-card { border-radius: 18px; } }
  </style>
</head>
<body>
  <main class="recovery-card">
    <a class="brand" href="../index.html" aria-label="SmartInspect - página inicial">
      <span class="brand-mark"><img src="../imagens/logo.png" alt=""></span>
      <span>Smart<b>Inspect</b></span>
    </a>

    <p class="eyebrow">Acesso à conta</p>
    <h1>Recuperar senha</h1>
    <p class="description">Informe o e-mail cadastrado. Se houver uma conta associada, enviaremos as instruções para redefinir sua senha.</p>

    <form id="recoveryForm">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" placeholder="voce@empresa.com" required>
      <button class="submit-button" type="submit">Enviar instruções</button>
      <p class="feedback" id="feedback" role="status" aria-live="polite"></p>
    </form>

    <a class="back-link" href="login.html">← Voltar para entrar</a>
  </main>

  <script>
    // A tela está pronta. Conecte este submit ao endpoint de recuperação do seu backend.
    document.getElementById('recoveryForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const feedback = document.getElementById('feedback');
      if (!this.reportValidity()) return;
      feedback.classList.remove('error');
      feedback.textContent = 'Interface pronta. Conecte o formulário ao serviço de envio de recuperação de senha.';
    });
  </script>
</body>
</html>
