<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planos | SmartInspect AI</title>
  <link rel="icon" href="./imagens/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#050b18;--bg2:#081426;--surface:rgba(13,28,50,.82);--border:rgba(133,216,255,.18);--cyan:#5cecff;--blue:#229dff;--violet:#9b7cff;--text:#e7f5ff;--muted:#91a8bd;--green:#35e58a;--red:#ff8799}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font:14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0,rgba(34,157,255,.18),transparent 28rem),radial-gradient(circle at 90% 65%,rgba(155,124,255,.14),transparent 30rem),linear-gradient(135deg,var(--bg),var(--bg2) 55%,#050b18)}
    button,a{font:inherit}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;width:min(1160px,calc(100% - 36px));margin:auto;border-bottom:1px solid rgba(133,216,255,.1)}.brand{display:flex;align-items:center;gap:11px;color:#fff;text-decoration:none;font-size:17px;letter-spacing:-.4px}.brand b{color:var(--cyan)}.brand-mark{display:grid;place-items:center;width:40px;height:40px;overflow:hidden;border:1px solid rgba(92,236,255,.34);border-radius:12px;background:rgba(92,236,255,.1)}.brand-mark img{width:100%;height:100%;object-fit:contain}.top-actions{display:flex;align-items:center;gap:9px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 15px;border:1px solid var(--border);border-radius:11px;color:var(--text);text-decoration:none;background:rgba(255,255,255,.05);cursor:pointer;transition:.2s}.button:hover{transform:translateY(-2px);border-color:var(--cyan);background:rgba(92,236,255,.1)}.button.primary{color:#03111d;border:0;font-weight:800;background:linear-gradient(135deg,var(--cyan),#42bfff)}.page{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:56px 0 80px}.headline{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:28px}.eyebrow{margin:0 0 9px;color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:.18em}.headline h1{margin:0;color:#fff;font:600 clamp(34px,5vw,58px) "Space Grotesk",Inter,sans-serif;letter-spacing:-.06em}.lead{max-width:640px;margin:13px 0 0;color:var(--muted);line-height:1.7}.status{margin:20px 0;padding:14px 16px;border:1px solid var(--border);border-radius:12px;color:var(--muted);background:rgba(92,236,255,.05)}.status.error{color:#ffb5bc;border-color:rgba(255,111,125,.3);background:rgba(255,79,99,.08)}.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.plan{display:flex;min-height:100%;flex-direction:column;overflow:hidden;border:1px solid var(--border);border-radius:20px;background:linear-gradient(145deg,rgba(18,42,72,.82),rgba(7,18,35,.86));box-shadow:0 22px 60px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.06);transition:.25s}.plan:hover{transform:translateY(-5px);border-color:rgba(92,236,255,.5);box-shadow:0 24px 70px rgba(0,170,255,.12)}.plan-cover{position:relative;display:grid;place-items:center;height:250px;overflow:hidden;background:radial-gradient(circle at 20% 20%,rgba(92,236,255,.42),transparent 36%),linear-gradient(135deg,#102b4a,#111734 55%,#24184b)}.plan-cover::after{position:absolute;inset:18px;border:1px solid rgba(255,255,255,.14);border-radius:18px;content:"";transform:rotate(-7deg)}.plan-cover img{position:absolute;z-index:1;width:100%;height:100%;padding:14px;object-fit:contain}.plan-symbol{position:relative;z-index:2;display:grid;place-items:center;width:62px;height:62px;border:1px solid rgba(255,255,255,.3);border-radius:20px;color:#fff;font:700 27px "Space Grotesk",sans-serif;background:rgba(3,11,23,.34);box-shadow:0 0 35px rgba(92,236,255,.25)}.plan-body{display:flex;flex:1;flex-direction:column;padding:22px}.plan h2{margin:0;color:#fff;font:600 23px "Space Grotesk",Inter,sans-serif}.plan-description{min-height:44px;margin:10px 0 18px;color:var(--muted);font-size:12px;line-height:1.65}.price{display:flex;align-items:baseline;gap:6px;margin-bottom:17px;color:var(--cyan);font:700 29px "Space Grotesk",Inter,sans-serif}.price small{color:var(--muted);font:500 11px Inter,sans-serif}.features{display:grid;gap:8px;margin:0 0 22px;padding:0;list-style:none;color:#d8ecf7;font-size:12px;line-height:1.5}.features li{display:flex;gap:8px}.features li::before{color:var(--green);content:"✓";font-weight:800}.plan .button{width:100%;margin-top:auto}.empty{grid-column:1/-1;padding:46px 20px;text-align:center;border:1px dashed rgba(133,216,255,.22);border-radius:18px;color:var(--muted);background:rgba(255,255,255,.025)}@media(max-width:820px){.plans{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.topbar{height:auto;min-height:68px}.brand{font-size:14px}.top-actions .session{display:none}.page{padding-top:35px}.headline{align-items:flex-start;flex-direction:column;gap:16px}.headline .button{width:100%}.plans{grid-template-columns:1fr}.plan-cover{height:210px}}
    .details-toggle{width:100%;min-height:40px;margin:0 0 14px;padding:0 15px;border:0;border-radius:11px;color:#03111d;font-weight:800;background:linear-gradient(135deg,var(--cyan),#42bfff);cursor:pointer;transition:.2s}
    .details-toggle:hover,.details-toggle[aria-expanded="true"]{transform:translateY(-2px);background:linear-gradient(135deg,#8af4ff,#65caff);box-shadow:0 8px 22px rgba(34,157,255,.2)}
    .plan-details{width:100%;margin:0 0 18px;padding:16px;border:1px solid rgba(133,216,255,.14);border-radius:13px;background:rgba(2,10,22,.34)}
    .plan-details[hidden]{display:none}
    .plan-details h3{margin:0 0 12px;color:#fff;font:600 16px "Space Grotesk",Inter,sans-serif}
    .term-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
    .term-option{min-height:76px;padding:10px 7px;border:1px solid var(--border);border-radius:10px;color:var(--text);background:rgba(255,255,255,.035);text-align:center;cursor:pointer;transition:.2s}
    .term-option strong{display:block;margin-bottom:6px;color:var(--cyan);font-size:11px}
    .term-option span{color:var(--muted);font-size:10px;line-height:1.4}
    .term-option:hover,.term-option[aria-pressed="true"]{border-color:var(--cyan);background:rgba(92,236,255,.12)}
    @media(max-width:380px){.term-options{grid-template-columns:1fr}.term-option{min-height:0}}
    /* Centraliza os nomes e textos nas caixas dos planos. */
    .plan-body{text-align:center;align-items:center}
    .plan h2,.plan-description{text-align:center;width:100%}
    .price{justify-content:center;width:100%}
    .features{width:100%;justify-items:center}
    .features li{justify-content:center;text-align:center}
    .plan .button{text-align:center}
    .headline{text-align:center;align-items:center;justify-content:center}
    .headline>div{width:100%;text-align:center}
    .headline .lead{margin-left:auto;margin-right:auto}
    .headline .button{justify-content:center;text-align:center}
  </style>
</head>
<body hidden>
<header class="topbar">
    <a class="brand" href="./index.html">
        <span class="brand-mark"><img src="./imagens/logo.png" alt=""></span>
        <strong>SmartInspect <b>AI</b></strong>
    </a>
    <div class="top-actions">
        <a class="button primary" href="./login.html">Entrar</a>
    </div>
</header>
  <main class="page" hidden id="plansPage"><section class="headline"><div><p class="eyebrow">SMARTINSPECT AI</p><h1>Planos e assinaturas</h1><p class="lead">Escolha a estrutura que melhor acompanha o crescimento da sua operação.</p></div></section><section id="plans" class="plans" aria-live="polite"></section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./js/supabase.js"></script>
  <script>
    (()=>{
      "use strict";
      const $=id=>document.getElementById(id), db=window.banco;
      const status = (text, error = false) => {
    const el = $("status");
    if (el) {
        el.textContent = text;
        el.className = "status" + (error ? " error" : "");
    }
};
      const parseDetails=(value)=>{if(value&&typeof value==="object")return value;if(typeof value!=="string")return {};try{const parsed=JSON.parse(value);return parsed&&typeof parsed==="object"?parsed:{descricao:value};}catch{return value?{descricao:value}:{}}};
      const defaultPlans=[
        {id:"essencial",nome:"Autônomo",preco:0,periodicidade:"mensal",recursos:{descricao:"Para começar a organizar sua operação com segurança e simplicidade.",imagem:"./imagens/autonomo.png",recursos:["Perfil e autenticação","Painel pessoal","Acesso ao chat","Suporte à estrutura futura"]}},
        {id:"profissional",nome:"Micro-empresarial",preco:49.9,periodicidade:"mensal",recursos:{descricao:"Para equipes que precisam colaborar, conversar e acompanhar seus ambientes.",imagem:"./imagens/micro-empresarial.png",recursos:["Tudo do Autônomo","Conversas privadas e grupos","Anexos e mensagens de áudio","Notificações e chamadas"]}},
        {id:"empresarial",nome:"Empresarial",preco:129.9,periodicidade:"mensal",recursos:{descricao:"Para operações em crescimento, com mais pessoas, empresas e recursos avançados.",imagem:"./imagens/empresarial.png",recursos:["Tudo do Micro-empresarial","Ambientes empresariais","Gestão de participantes","Recursos avançados futuros"]}}
      ];
      const money=value=>{if(value===null||value===undefined||value==="")return "Preço não definido";const n=Number(value);return Number.isFinite(n)?n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}):String(value);};
      const render=(rows)=>{
        const box=$("plans");
        box.replaceChildren();
        if(!rows.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="Nenhum plano está disponível no momento.";box.append(empty);return;}
        for(const originalPlan of rows){
          const fixedNames={essencial:"Autônomo",autonomo:"Autônomo",profissional:"Micro-empresarial","micro-empresarial":"Micro-empresarial",empresarial:"Empresarial"};
          const plan={...originalPlan,nome:fixedNames[String(originalPlan.id||"").toLowerCase()]||originalPlan.nome};
          const details=parseDetails(plan.recursos),card=document.createElement("article");
          card.className="plan";
          card.id="plano-"+(plan.id||"");
          const rawPlanName=(String(plan.id||"")+" "+String(plan.nome||"")).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
          const photoPrefix=rawPlanName.includes("micro")||rawPlanName.includes("profissional")?"micro-empresarial":rawPlanName.includes("empresarial")?"empresarial":rawPlanName.includes("autonomo")||rawPlanName.includes("essencial")?"autonomo":"";
          const termPrices={
            autonomo:{"sem-fidelidade":59.99,"3-meses":49.99,"12-meses":39.99},
            "micro-empresarial":{"sem-fidelidade":89.99,"3-meses":79.99,"12-meses":69.99},
            empresarial:{"sem-fidelidade":79.99,"3-meses":69.99,"12-meses":59.99}
          }[photoPrefix]||{};
          let coverImage=null;
          const cover=document.createElement("div");cover.className="plan-cover";
          const initialImage=photoPrefix?`./imagens/${photoPrefix}.png`:(details.imagem_url||details.imagem);
          if(initialImage){coverImage=document.createElement("img");coverImage.src=initialImage;coverImage.alt="Imagem do plano "+(plan.nome||"")+" sem fidelidade";cover.append(coverImage);}
          else{const symbol=document.createElement("span");symbol.className="plan-symbol";symbol.textContent=(plan.nome||"P").trim().charAt(0).toUpperCase();cover.append(symbol);}
          const body=document.createElement("div");body.className="plan-body";
          const title=document.createElement("h2");title.textContent=plan.nome||"Plano SmartInspect";
          const description=document.createElement("p");description.className="plan-description";description.textContent=details.descricao||details.description||"Estrutura configurável para sua operação.";
          const price=document.createElement("div");price.className="price";price.textContent=money(termPrices["sem-fidelidade"]??plan.preco);
          if(plan.preco!==null&&plan.preco!==undefined&&plan.preco!==""){const period=document.createElement("small");period.textContent="/ "+(plan.periodicidade||"período");price.append(period);}
          const toggle=document.createElement("button");toggle.type="button";toggle.className="details-toggle";toggle.textContent="Ver detalhes e valores";toggle.setAttribute("aria-expanded","false");
          const panel=document.createElement("section");panel.className="plan-details";panel.hidden=true;
          const detailHeading=document.createElement("h3");detailHeading.textContent="Recursos incluídos";panel.append(detailHeading);
          const list=document.createElement("ul");list.className="features";
          const features=Array.isArray(details)?details:Array.isArray(details.recursos)?details.recursos:Array.isArray(details.features)?details.features:[];
          for(const item of features.slice(0,8)){const li=document.createElement("li");li.textContent=typeof item==="object"?(item.nome||item.name||item.text||""):String(item);if(li.textContent)list.append(li);}
          if(!list.children.length){const li=document.createElement("li");li.textContent="Acesso aos recursos autorizados do plano";list.append(li);}panel.append(list);
          const termsHeading=document.createElement("h3");termsHeading.textContent="Escolha a fidelidade";termsHeading.style.marginTop="18px";panel.append(termsHeading);
          const terms=document.createElement("div");terms.className="term-options";
          const termChoices=[["sem-fidelidade","Sem fidelidade"],["3-meses","3 meses de fidelidade"],["12-meses","12 meses de fidelidade"]];
          for(const [termKey,termLabel] of termChoices){const option=document.createElement("button");option.type="button";option.className="term-option";option.setAttribute("aria-pressed","false");option.dataset.term=termKey;const label=document.createElement("strong");label.textContent=termLabel;const value=document.createElement("span");value.textContent=termPrices[termKey]!==undefined?money(termPrices[termKey])+" / mês":"Valor a definir pela tabela";option.append(label,value);option.addEventListener("click",()=>{terms.querySelectorAll(".term-option").forEach(item=>item.setAttribute("aria-pressed","false"));option.setAttribute("aria-pressed","true");if(termPrices[termKey]!==undefined&&price.firstChild){price.firstChild.textContent=money(termPrices[termKey]);}if(coverImage&&photoPrefix){coverImage.src=`./imagens/${photoPrefix}-${termKey}.png`;coverImage.alt=`Imagem do plano ${plan.nome||""} — ${termLabel}`;}});terms.append(option);}panel.append(terms);
          toggle.addEventListener("click",()=>{const open=panel.hidden;panel.hidden=!open;toggle.setAttribute("aria-expanded",String(open));toggle.textContent=open?"Ocultar detalhes":"Ver detalhes e valores";});
          body.append(title,description,price,toggle,panel);card.append(cover,body);box.append(card);
        }
        const hash=decodeURIComponent(location.hash.slice(1));
        if(hash){const selected=document.getElementById(hash)||document.getElementById("plano-"+hash);if(selected){const toggle=selected.querySelector(".details-toggle");if(toggle){toggle.click();selected.scrollIntoView({behavior:"smooth",block:"center"});}}}
      };
      //****** Versão pública da Página Planos(sem verificação de login)*****
       document.body.hidden = false;
       document.getElementById("plansPage").hidden = false;
      //**********************************************************************
async function init() {
    // Torna a página visível
    document.body.hidden = false;
    const plansPage = document.getElementById("plansPage");
    if (plansPage) plansPage.hidden = false;

    // Tenta buscar do Supabase, mas usa os defaultPlans se falhar
    let rows = defaultPlans;
    try {
        const result = await db.from("planos").select("id,nome,preco,periodicidade,recursos,ativo").eq("ativo", true).order("preco", { ascending: true });
        if (!result.error && result.data && result.data.length > 0) {
            rows = result.data;
        }
    } catch (e) {
        console.warn("Usando planos padrão (banco indisponível).");
    }

    render(rows);}

// Executa a inicialização
init().catch(error => {
    console.error(error);
    // Mesmo com erro, tenta renderizar os planos padrão
    render(defaultPlans);
    status("Exibindo os planos iniciais.");
});    })();
  </script>
</body>
</html>
