<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planos | SmartInspect AI</title>
  <link rel="icon" href="./imagens/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#050b18;--bg2:#081426;--surface:rgba(13,28,50,.82);--border:rgba(133,216,255,.18);--cyan:#5cecff;--blue:#229dff;--violet:#9b7cff;--text:#e7f5ff;--muted:#91a8bd;--green:#35e58a;--red:#ff8799}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);font:14px Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0,rgba(34,157,255,.18),transparent 28rem),radial-gradient(circle at 90% 65%,rgba(155,124,255,.14),transparent 30rem),linear-gradient(135deg,var(--bg),var(--bg2) 55%,#050b18)}
    button,a{font:inherit}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;width:min(1160px,calc(100% - 36px));margin:auto;border-bottom:1px solid rgba(133,216,255,.1)}.brand{display:flex;align-items:center;gap:11px;color:#fff;text-decoration:none;font-size:17px;letter-spacing:-.4px}.brand b{color:var(--cyan)}.brand-mark{display:grid;place-items:center;width:40px;height:40px;overflow:hidden;border:1px solid rgba(92,236,255,.34);border-radius:12px;background:rgba(92,236,255,.1)}.brand-mark img{width:100%;height:100%;object-fit:contain}.top-actions{display:flex;align-items:center;gap:9px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 15px;border:1px solid var(--border);border-radius:11px;color:var(--text);text-decoration:none;background:rgba(255,255,255,.05);cursor:pointer;transition:.2s}.button:hover{transform:translateY(-2px);border-color:var(--cyan);background:rgba(92,236,255,.1)}.button.primary{color:#03111d;border:0;font-weight:800;background:linear-gradient(135deg,var(--cyan),#42bfff)}.page{width:min(1160px,calc(100% - 36px));margin:0 auto;padding:56px 0 80px}.headline{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:28px}.eyebrow{margin:0 0 9px;color:var(--cyan);font-size:10px;font-weight:800;letter-spacing:.18em}.headline h1{margin:0;color:#fff;font:600 clamp(34px,5vw,58px) "Space Grotesk",Inter,sans-serif;letter-spacing:-.06em}.lead{max-width:640px;margin:13px 0 0;color:var(--muted);line-height:1.7}.status{margin:20px 0;padding:14px 16px;border:1px solid var(--border);border-radius:12px;color:var(--muted);background:rgba(92,236,255,.05)}.status.error{color:#ffb5bc;border-color:rgba(255,111,125,.3);background:rgba(255,79,99,.08)}.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.plan{display:flex;min-height:100%;flex-direction:column;overflow:hidden;border:1px solid var(--border);border-radius:20px;background:linear-gradient(145deg,rgba(18,42,72,.82),rgba(7,18,35,.86));box-shadow:0 22px 60px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.06);transition:.25s}.plan:hover{transform:translateY(-5px);border-color:rgba(92,236,255,.5);box-shadow:0 24px 70px rgba(0,170,255,.12)}.plan-cover{position:relative;display:grid;place-items:center;height:142px;overflow:hidden;background:radial-gradient(circle at 20% 20%,rgba(92,236,255,.42),transparent 36%),linear-gradient(135deg,#102b4a,#111734 55%,#24184b)}.plan-cover::after{position:absolute;inset:18px;border:1px solid rgba(255,255,255,.14);border-radius:18px;content:"";transform:rotate(-7deg)}.plan-cover img{position:absolute;z-index:1;width:100%;height:100%;object-fit:cover}.plan-symbol{position:relative;z-index:2;display:grid;place-items:center;width:62px;height:62px;border:1px solid rgba(255,255,255,.3);border-radius:20px;color:#fff;font:700 27px "Space Grotesk",sans-serif;background:rgba(3,11,23,.34);box-shadow:0 0 35px rgba(92,236,255,.25)}.plan-body{display:flex;flex:1;flex-direction:column;padding:22px}.plan h2{margin:0;color:#fff;font:600 23px "Space Grotesk",Inter,sans-serif}.plan-description{min-height:44px;margin:10px 0 18px;color:var(--muted);font-size:12px;line-height:1.65}.price{display:flex;align-items:baseline;gap:6px;margin-bottom:17px;color:var(--cyan);font:700 29px "Space Grotesk",Inter,sans-serif}.price small{color:var(--muted);font:500 11px Inter,sans-serif}.features{display:grid;gap:8px;margin:0 0 22px;padding:0;list-style:none;color:#d8ecf7;font-size:12px;line-height:1.5}.features li{display:flex;gap:8px}.features li::before{color:var(--green);content:"✓";font-weight:800}.plan .button{width:100%;margin-top:auto}.empty{grid-column:1/-1;padding:46px 20px;text-align:center;border:1px dashed rgba(133,216,255,.22);border-radius:18px;color:var(--muted);background:rgba(255,255,255,.025)}@media(max-width:820px){.plans{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.topbar{height:auto;min-height:68px}.brand{font-size:14px}.top-actions .session{display:none}.page{padding-top:35px}.headline{align-items:flex-start;flex-direction:column;gap:16px}.headline .button{width:100%}.plans{grid-template-columns:1fr}.plan-cover{height:128px}}
  </style>
</head>
<body hidden>
  <header class="topbar"><a class="brand" href="./painel-pessoal.html"><span class="brand-mark"><img src="./imagens/logo.png" alt=""></span><strong>SmartInspect <b>AI</b></strong></a><div class="top-actions"><span class="session" id="sessionLabel">Verificando sessão…</span><a class="button" href="./painel-pessoal.html">← Voltar ao painel</a><button id="logoutButton" class="button" type="button">Sair</button></div></header>
  <main class="page" hidden id="plansPage"><section class="headline"><div><p class="eyebrow">SMARTINSPECT AI</p><h1>Planos e assinaturas</h1><p class="lead">Escolha a estrutura que melhor acompanha o crescimento da sua operação. Os planos abaixo são carregados diretamente do seu projeto.</p></div><a class="button primary" href="./painel-pessoal.html">Ir para o painel →</a></section><div id="status" class="status">Carregando planos…</div><section id="plans" class="plans" aria-live="polite"></section></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./js/supabase.js"></script>
  <script>
    (()=>{
      "use strict";
      const $=id=>document.getElementById(id), db=window.banco;
      const status=(text,error=false)=>{const el=$("status");el.textContent=text;el.className="status"+(error?" error":"");};
      const parseDetails=(value)=>{if(value&&typeof value==="object")return value;if(typeof value!=="string")return {};try{const parsed=JSON.parse(value);return parsed&&typeof parsed==="object"?parsed:{descricao:value};}catch{return value?{descricao:value}:{}}};
      const defaultPlans=[
        {id:"essencial",nome:"Plano Essencial",preco:0,periodicidade:"mensal",recursos:{descricao:"Para começar a organizar sua operação com segurança e simplicidade.",imagem:"./imagens/image.png",recursos:["Perfil e autenticação","Painel pessoal","Acesso ao chat","Suporte à estrutura futura"]}},
        {id:"profissional",nome:"Plano Profissional",preco:49.9,periodicidade:"mensal",recursos:{descricao:"Para equipes que precisam colaborar, conversar e acompanhar seus ambientes.",imagem:"./imagens/image2.png",recursos:["Tudo do Essencial","Conversas privadas e grupos","Anexos e mensagens de áudio","Notificações e chamadas"]}},
        {id:"empresarial",nome:"Plano Empresarial",preco:129.9,periodicidade:"mensal",recursos:{descricao:"Para operações em crescimento, com mais pessoas, empresas e recursos avançados.",imagem:"./imagens/image3.png",recursos:["Tudo do Profissional","Ambientes empresariais","Gestão de participantes","Recursos avançados futuros"]}}
      ];
      const money=value=>{if(value===null||value===undefined||value==="")return "Preço não definido";const n=Number(value);return Number.isFinite(n)?n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}):String(value);};
      const render=(rows)=>{const box=$("plans");box.replaceChildren();if(!rows.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="Nenhum plano está disponível no momento.";box.append(empty);return;}for(const plan of rows){const details=parseDetails(plan.recursos),card=document.createElement("article");card.className="plan";const cover=document.createElement("div");cover.className="plan-cover";if(details.imagem_url||details.imagem){const image=document.createElement("img");image.src=details.imagem_url||details.imagem;image.alt="Imagem do plano "+(plan.nome||"");cover.append(image);}else{const symbol=document.createElement("span");symbol.className="plan-symbol";symbol.textContent=(plan.nome||"P").trim().charAt(0).toUpperCase();cover.append(symbol);}const body=document.createElement("div");body.className="plan-body";const title=document.createElement("h2");title.textContent=plan.nome||"Plano SmartInspect";const description=document.createElement("p");description.className="plan-description";description.textContent=details.descricao||details.description||"Estrutura configurável para sua operação.";const price=document.createElement("div");price.className="price";price.textContent=money(plan.preco);if(plan.preco!==null&&plan.preco!==undefined&&plan.preco!==""){const period=document.createElement("small");period.textContent="/ "+(plan.periodicidade||"período");price.append(period);}const list=document.createElement("ul");list.className="features";const features=Array.isArray(details)?details:Array.isArray(details.recursos)?details.recursos:Array.isArray(details.features)?details.features:[];for(const item of features.slice(0,8)){const li=document.createElement("li");li.textContent=typeof item==="object"?(item.nome||item.name||item.text||""):String(item);if(li.textContent)list.append(li);}if(!list.children.length){const li=document.createElement("li");li.textContent="Acesso aos recursos autorizados do plano";list.append(li);}const button=document.createElement("a");button.className="button primary";button.href="./painel-pessoal.html";button.textContent="Continuar pelo painel";body.append(title,description,price,list,button);card.append(cover,body);box.append(card);}};
      async function init(){if(!db||!window.supabaseConfigStatus?.pronto){location.replace("./login.html");return;}const session=await db.auth.getSession();if(session.error||!session.data.session?.user){location.replace("./login.html");return;}$("sessionLabel").textContent="Sessão protegida";document.body.hidden=false;$("plansPage").hidden=false;$("logoutButton").onclick=async()=>{await db.auth.signOut();location.replace("./login.html")};const result=await db.from("planos").select("id,nome,preco,periodicidade,recursos,ativo").eq("ativo",true).order("preco",{ascending:true});const rows=result.error||!result.data?.length?defaultPlans:result.data;render(rows);status(result.error?"Exibindo os planos iniciais enquanto a tabela é configurada.":"Planos disponíveis para sua conta.");}
      init().catch(error=>{console.error(error);location.replace("./login.html")});
    })();
  </script>
</body>
</html>
