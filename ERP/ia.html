<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartInspect AI - Em desenvolvimento</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../imagens/favicon.png">
  <style>
    .erp-page--ia .ia-development-card { width:min(100%,680px); margin:clamp(42px,10vh,110px) auto; padding:clamp(28px,5vw,54px); text-align:center; }
    .erp-page--ia .ia-development-icon { display:grid; width:64px; height:64px; margin:0 auto 20px; place-items:center; border:1px solid rgba(92,236,255,.25); border-radius:18px; color:var(--cyan); background:rgba(92,236,255,.08); }
    .erp-page--ia .ia-development-icon svg { width:31px; height:31px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
    .erp-page--ia .ia-development-card h1 { margin:0; color:var(--text); font-size:clamp(24px,4vw,34px); letter-spacing:-.035em; }
    .erp-page--ia .ia-development-card > p:not(.eyebrow) { margin:12px auto 24px; max-width:460px; color:var(--muted); line-height:1.65; }
  </style>
</head>
<body class="erp-page--ia">
  <div class="menu-container"></div>

  <main class="content">
    <section class="card ia-development-card" aria-labelledby="iaDevelopmentTitle">
      <div class="ia-development-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3v2m-7 5h14v9H5zM8 14h.01M16 14h.01M9 17h6M3 12h2m14 0h2"></path></svg>
      </div>
      <p class="eyebrow">SMARTINSPECT AI</p>
      <h1 id="iaDevelopmentTitle">Recurso em desenvolvimento</h1>
      <p>O assistente de inteligência artificial estará disponível em uma próxima atualização.</p>
      <a href="dashboard.html" class="secondary-button">Voltar ao dashboard</a>
    </section>
  </main>

</body>
</html>
