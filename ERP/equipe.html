<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Equipe - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">


<style>

.equipe-grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(300px,1fr));

gap:20px;

}



.membro{

background:white;

padding:20px;

border-radius:15px;

box-shadow:0 3px 10px #0002;

display:flex;

align-items:center;

gap:15px;

}



.avatar-box{

position:relative;

}



.foto-perfil{

width:80px;

height:80px;

border-radius:50%;

object-fit:cover;

border:3px solid #0066cc;

background:#eee;

}



.ponto-online{

position:absolute;

right:5px;

bottom:5px;

width:16px;

height:16px;

border-radius:50%;

background:#999;

border:2px solid white;

}



.ponto-online.ativo{

background:#16a34a;

box-shadow:0 0 8px #16a34a;

}



.status{

font-size:14px;

font-weight:600;

}



.online{

color:#16a34a;

}



.offline{

color:gray;

}



.cargo{

background:#0066cc;

color:white;

padding:5px 10px;

border-radius:10px;

font-size:13px;

}



.permissoes{

margin-top:10px;

font-size:13px;

line-height:1.6;

}



.ultimo-acesso{

font-size:13px;

color:#666;

margin-top:8px;

}



</style>

</head>



<body>


<!-- SIDEBAR PADRÃO -->

<div class="menu-container"></div>



<div class="content">


<h1>👥 Equipe</h1>


<p>

Usuários cadastrados e níveis de acesso

</p>



<div id="listaEquipe" class="equipe-grid">

Carregando equipe...

</div>



</div>



<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/sidebar.js"></script>

<script src="js/configuracoes.js"></script>
<script src="js/auth.js"></script>



<script>


let equipe = [];

let canalEquipe = null;



/* =====================================================
   VERIFICAR SE USUÁRIO ESTÁ ONLINE
===================================================== */

function estaOnline(usuario){


    if(!usuario.ultimo_heartbeat){

        return false;

    }


    const ultimoHeartbeat =

        new Date(
            usuario.ultimo_heartbeat
        ).getTime();


    const agora = Date.now();


    const diferenca =

        agora - ultimoHeartbeat;


    /*
       Consideramos o usuário online
       se o heartbeat aconteceu nos
       últimos 60 segundos.
    */

    return diferenca <= 60000;

}



/* =====================================================
   CARREGAR EQUIPE
===================================================== */

async function carregarEquipe(){


    const {data,error} = await banco

        .from("usuarios")

        .select("*")

        .order(
            "id",
            {
                ascending:false
            }
        );



    if(error){


        console.log(
            "Erro ao carregar equipe:",
            error
        );


        document.getElementById(
            "listaEquipe"
        ).innerHTML =

        "❌ Erro ao carregar equipe";


        return;

    }



    equipe = data || [];


    mostrarEquipe();


}



/* =====================================================
   PERMISSÕES
===================================================== */

function obterPermissoes(nivel){


    if(nivel === "adm"){

        return "✅ Controle total do sistema";

    }



    if(nivel === "engenheiro"){

        return `
        ✅ Obras<br>
        ✅ Inspeções<br>
        ✅ Relatórios<br>
        ✅ IA
        `;

    }



    if(nivel === "inspetor"){

        return `
        ✅ Inspeções<br>
        ✅ Fotos<br>
        ✅ Relatórios
        `;

    }



    if(nivel === "tecnico"){

        return `
        ✅ Obras<br>
        ✅ Inspeções
        `;

    }



    if(nivel === "usuario"){

        return "👁 Visualização";

    }



    return "👁 Acesso básico";

}



/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarData(data){


    if(!data){

        return "Nunca";

    }


    try{

        return new Date(
            data
        ).toLocaleString(
            "pt-BR"
        );

    }

    catch{

        return "Data inválida";

    }

}



/* =====================================================
   MOSTRAR EQUIPE
===================================================== */

function mostrarEquipe(){


    const lista =

        document.getElementById(
            "listaEquipe"
        );



    lista.innerHTML = "";



    if(equipe.length === 0){


        lista.innerHTML =

        "Nenhum usuário encontrado.";


        return;

    }



    equipe.forEach(
        usuario => {


        const online =

            estaOnline(
                usuario
            );


        const permissoes =

            obterPermissoes(
                usuario.nivel_acesso
            );



        lista.innerHTML += `


        <div class="membro">


            <div class="avatar-box">


                <img

                    class="foto-perfil"

                    src="${
                        usuario.foto_url ||
                        'imagens/avatar.png'
                    }"

                    onerror="
                        this.src='imagens/avatar.png'
                    "

                >


                <span

                    class="
                        ponto-online
                        ${online ? 'ativo' : ''}
                    "

                ></span>


            </div>



            <div>


                <h3>

                    ${
                        usuario.nome ||
                        "Sem nome"
                    }

                </h3>



                <p>

                    📧 ${
                        usuario.email ||
                        ""
                    }

                </p>



                <span class="cargo">

                    ${
                        usuario.nivel_acesso ||
                        "usuario"
                    }

                </span>



                <p

                    class="
                        status
                        ${
                            online
                            ? "online"
                            : "offline"
                        }
                    "

                >

                    ●

                    ${
                        online
                        ? " Online"
                        : " Offline"
                    }

                </p>



                <p class="ultimo-acesso">

                    🕐 Último acesso:

                    <br>

                    ${
                        formatarData(
                            usuario.ultimo_acesso
                        )
                    }

                </p>



                <div class="permissoes">

                    ${permissoes}

                </div>


            </div>


        </div>


        `;


    });


}



/* =====================================================
   PEGAR USUÁRIO LOGADO
===================================================== */

async function obterUsuarioLogado(){


    const {

        data,

        error

    } = await banco.auth.getUser();



    if(error){


        console.log(

            "Erro ao pegar usuário:",

            error

        );


        return null;

    }



    return data.user;

}



/* =====================================================
   ATUALIZAR HEARTBEAT
===================================================== */

async function atualizarHeartbeat(){


    const usuario =

        await obterUsuarioLogado();



    if(!usuario){

        return;

    }



    const agora =

        new Date().toISOString();



    const {error} =

        await banco

        .from("usuarios")

        .update({

            ultimo_heartbeat:

                agora

        })

        .eq(

            "auth_id",

            usuario.id

        );



    if(error){


        console.log(

            "Erro no heartbeat:",

            error

        );


    }

}



/* =====================================================
   REGISTRAR ÚLTIMO ACESSO
===================================================== */

async function registrarAcesso(){


    const usuario =

        await obterUsuarioLogado();



    if(!usuario){

        return;

    }



    const agora =

        new Date().toISOString();



    const {error} =

        await banco

        .from("usuarios")

        .update({

            ultimo_acesso:

                agora,

            ultimo_heartbeat:

                agora

        })

        .eq(

            "auth_id",

            usuario.id

        );



    if(error){


        console.log(

            "Erro ao registrar acesso:",

            error

        );


    }

}



/* =====================================================
   INICIAR PRESENÇA
===================================================== */

async function iniciarPresenca(){


    await registrarAcesso();



    /*
       Atualiza o heartbeat
       a cada 30 segundos.
    */

    setInterval(

        atualizarHeartbeat,

        30000

    );


}



/* =====================================================
   REALTIME DO SUPABASE
===================================================== */

function ouvirOnline(){


    canalEquipe =

        banco

        .channel(

            "equipe-tempo-real"

        )


        .on(

            "postgres_changes",

            {

                event:"*",

                schema:"public",

                table:"usuarios"

            },

            payload => {


                console.log(

                    "Atualização da equipe:",

                    payload

                );


                carregarEquipe();


            }

        )


        .subscribe(

            status => {


                console.log(

                    "Realtime equipe:",

                    status

                );


            }

        );


}



/* =====================================================
   ATUALIZAR STATUS VISUAL
===================================================== */

setInterval(

    () => {


        /*
           Mesmo que nenhum registro
           seja alterado no banco,
           atualizamos a tela para
           detectar quem ficou offline.
        */

        mostrarEquipe();


    },

    10000

);



/* =====================================================
   INICIAR SISTEMA
===================================================== */

async function iniciar(){


    await carregarEquipe();


    await iniciarPresenca();


    ouvirOnline();


}



iniciar();


</script>


</body>

</html>
