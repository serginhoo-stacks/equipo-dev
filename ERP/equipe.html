<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Equipe - SmartInspect AI</title>

<link rel="stylesheet" href="../css/style.css">



</head>

<body class="erp-page--equipe">

<!-- SIDEBAR PADRÃO -->
<div class="menu-container"></div>

<div class="content">

<h1>👥 Equipe</h1>
<p>Usuários cadastrados e níveis de acesso</p>

<div id="listaEquipe" class="equipe-grid">
Carregando equipe...
</div>

</div>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/sidebar.js"></script>
<!-- REMOVIDO: auth.js e configuracoes.js -->

<script>
    let equipe = [];
    let canalEquipe = null;

    function estaOnline(usuario){
        if(!usuario.ultimo_heartbeat){ return false; }
        const ultimoHeartbeat = new Date(usuario.ultimo_heartbeat).getTime();
        const agora = Date.now();
        const diferenca = agora - ultimoHeartbeat;
        return diferenca <= 60000; // 60 segundos
    }

    async function carregarEquipe(){
        const {data,error} = await banco.from("usuarios").select("*").order("id", { ascending:false });

        if(error){
            console.log("Erro ao carregar equipe:", error);
            document.getElementById("listaEquipe").innerHTML = "❌ Erro ao carregar equipe";
            return;
        }

        equipe = data || [];
        mostrarEquipe();
    }

    function obterPermissoes(nivel){
        if(nivel === "adm") return "✅ Controle total do sistema";
        if(nivel === "engenheiro") return `✅ Obras<br>✅ Inspeções<br>✅ Relatórios<br>✅ IA`;
        if(nivel === "inspetor") return `✅ Inspeções<br>✅ Fotos<br>✅ Relatórios`;
        if(nivel === "tecnico") return `✅ Obras<br>✅ Inspeções`;
        if(nivel === "usuario") return "👁 Visualização";
        return "👁 Acesso básico";
    }

    function formatarData(data){
        if(!data) return "Nunca";
        try { return new Date(data).toLocaleString("pt-BR"); } catch { return "Data inválida"; }
    }

    function mostrarEquipe(){
        const lista = document.getElementById("listaEquipe");
        lista.innerHTML = "";

        if(equipe.length === 0){
            lista.innerHTML = "Nenhum usuário encontrado.";
            return;
        }

        equipe.forEach(usuario => {
            const online = estaOnline(usuario);
            const permissoes = obterPermissoes(usuario.nivel_acesso);

            lista.innerHTML += `
            <div class="membro">
                <div class="avatar-box">
                    <img class="foto-perfil" src="${usuario.foto_url || 'imagens/avatar.png'}" onerror="this.src='../imagens/avatar.png'">
                    <span class="ponto-online ${online ? 'ativo' : ''}"></span>
                </div>

                <div>
                    <h3>${usuario.nome || "Sem nome"}</h3>
                    <p>📧 ${usuario.email || ""}</p>
                    <span class="cargo">${usuario.nivel_acesso || "usuario"}</span>
                    <p class="status ${online ? "online" : "offline"}">● ${online ? " Online" : " Offline"}</p>
                    <p class="ultimo-acesso">🕐 Último acesso: <br>${formatarData(usuario.ultimo_acesso)}</p>
                    <div class="permissoes">${permissoes}</div>
                </div>
            </div>
            `;
        });
    }

    async function obterUsuarioLogado(){
        const { data, error } = await banco.auth.getUser();
        if(error){ console.log("Erro ao pegar usuário:", error); return null; }
        return data.user;
    }

    async function atualizarHeartbeat(){
        const usuario = await obterUsuarioLogado();
        if(!usuario){ return; }
        const agora = new Date().toISOString();
        const {error} = await banco.from("usuarios").update({ ultimo_heartbeat: agora }).eq("auth_id", usuario.id);
        if(error){ console.log("Erro no heartbeat:", error); }
    }

    async function registrarAcesso(){
        const usuario = await obterUsuarioLogado();
        if(!usuario){ return; }
        const agora = new Date().toISOString();
        const {error} = await banco.from("usuarios").update({ ultimo_acesso: agora, ultimo_heartbeat: agora }).eq("auth_id", usuario.id);
        if(error){ console.log("Erro ao registrar acesso:", error); }
    }

    async function iniciarPresenca(){
        await registrarAcesso();
        setInterval(atualizarHeartbeat, 30000);
    }

    function ouvirOnline(){
        canalEquipe = banco.channel("equipe-tempo-real").on("postgres_changes", { event:"*", schema:"public", table:"usuarios" }, payload => {
            carregarEquipe();
        }).subscribe(status => {
            // console.log("Realtime equipe:", status);
        });
    }

    setInterval(() => { mostrarEquipe(); }, 10000);

    async function iniciar(){
        await carregarEquipe();
        await iniciarPresenca();
        ouvirOnline();
    }

    iniciar();
</script>

</body>
</html>
