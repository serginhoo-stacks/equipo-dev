<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notificações - SmartInspect AI</title>

<link rel="stylesheet" href="../css/style.css">



</head>

<body class="erp-page--notificacoes">

<div class="menu-container"></div>

<div class="content">

<div class="notificacoes-header">

<div>

<h1>🔔 Notificações</h1>

<p>
Central de alertas e acontecimentos das obras
</p>

</div>

<div
id="contador"
class="contador-notificacoes"
>

0 não lidas

</div>

</div>

<!-- FILTROS -->

<div class="filtros-notificacoes">

<button
class="filtro active"
data-filtro="todos"

>

Todas </button>

<button
class="filtro"
data-filtro="nao_lidas"

>

🔔 Não lidas </button>

<button
class="filtro"
data-filtro="critico"

>

🔴 Crítico </button>

<button
class="filtro"
data-filtro="atencao"

>

🟠 Atenção </button>

<button
class="filtro"
data-filtro="informativo"

>

🟡 Informativo </button>

<button
class="filtro"
data-filtro="concluido"

>

🟢 Concluído </button>

</div>

<!-- LISTA -->

<div id="listaNotificacoes">

<div class="card">

Carregando notificações...

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="../js/configuracoes.js"></script>
<script src="../js/auth.js"></script>

<script src="../js/sidebar.js"></script>

<script>

verificarLogin();


let notificacoes = [];

let filtroAtual = "todos";


const $ = id =>
document.getElementById(id);



/* ==========================================
   ESCAPAR HTML
========================================== */

function esc(valor) {

return String(valor || "")
.replace(/&/g, "&amp;")
.replace(/</g, "&lt;")
.replace(/>/g, "&gt;")
.replace(/"/g, "&quot;")
.replace(/'/g, "&#039;");

}



/* ==========================================
   ÍCONE DA PRIORIDADE
========================================== */

function iconePrioridade(prioridade) {

if (prioridade === "critico")
return "🔴";

if (prioridade === "atencao")
return "🟠";

if (prioridade === "concluido")
return "🟢";

return "🟡";

}



/* ==========================================
   NOME DA PRIORIDADE
========================================== */

function nomePrioridade(prioridade) {

if (prioridade === "critico")
return "CRÍTICO";

if (prioridade === "atencao")
return "ATENÇÃO";

if (prioridade === "concluido")
return "CONCLUÍDO";

return "INFORMATIVO";

}



/* ==========================================
   DATA
========================================== */

function formatarData(data) {

if (!data)
return "";

return new Date(data).toLocaleString(
"pt-BR",
{
dateStyle: "short",
timeStyle: "short"
}
);

}



/* ==========================================
   CARREGAR
========================================== */

async function carregarNotificacoes() {


const { data, error } =

await banco

.from("notificacoes")

.select("*")

.order(
"criado_em",
{
ascending: false
}
);


if (error) {

console.error(error);

$("listaNotificacoes").innerHTML = `

<div class="card">

❌ Erro ao carregar notificações.

<br><br>

${esc(error.message)}

</div>

`;

return;

}


notificacoes = data || [];

renderizarNotificacoes();

}



/* ==========================================
   RENDERIZAR
========================================== */

function renderizarNotificacoes() {


const naoLidas =

notificacoes.filter(
item => !item.lida
).length;


$("contador").textContent =

`${naoLidas} não lida${naoLidas === 1 ? "" : "s"}`;



let lista =

notificacoes.filter(
notificacao => {


if (
filtroAtual === "todos"
)
return true;


if (
filtroAtual === "nao_lidas"
)
return !notificacao.lida;


return (
notificacao.prioridade ===
filtroAtual
);

}
);



if (!lista.length) {

$("listaNotificacoes").innerHTML = `

<div class="card empty-state">

🔔

<h3>

Nenhuma notificação encontrada

</h3>

<p>

Quando houver novos acontecimentos,
eles aparecerão aqui.

</p>

</div>

`;

return;

}



$("listaNotificacoes").innerHTML =

lista.map(notificacao => `

<article
class="card notificacao
${esc(notificacao.prioridade || "informativo")}
${notificacao.lida ? "lida" : ""}"
>


<div class="notificacao-topo">

<div>

<span class="prioridade">

${iconePrioridade(notificacao.prioridade)}

${nomePrioridade(notificacao.prioridade)}

</span>

<h3>

${esc(notificacao.titulo)}

</h3>

</div>


<span class="data-notificacao">

${formatarData(notificacao.criado_em)}

</span>

</div>



<p>

${esc(notificacao.mensagem)}

</p>



${
notificacao.problema
?
`

<p>

<strong>
Problema:
</strong>

${esc(notificacao.problema)}

</p>

`
:
""
}



${
notificacao.impacto
?
`

<p>

<strong>
Impacto:
</strong>

${esc(notificacao.impacto)}

</p>

`
:
""
}



${
notificacao.recomendacao
?
`

<p>

<strong>
Ação recomendada:
</strong>

${esc(notificacao.recomendacao)}

</p>

`
:
""
}



<div class="notificacao-acoes">


${
!notificacao.lida
?

`

<button
class="botao-pequeno botao-lida"
onclick="marcarLida(${notificacao.id})"
>

✅ Marcar como lida

</button>

`

:

`

<button
class="botao-pequeno botao-lida"
disabled
>

✓ Lida

</button>

`
}



<button
class="botao-pequeno botao-excluir"
onclick="excluirNotificacao(${notificacao.id})"
>

🗑 Excluir

</button>


</div>


</article>

`).join("");

}



/* ==========================================
   MARCAR COMO LIDA
========================================== */

async function marcarLida(id) {


const { error } =

await banco

.from("notificacoes")

.update({
lida: true
})

.eq(
"id",
id
);


if (error) {

console.error(error);

alert(
"Não foi possível marcar a notificação."
);

return;

}


const notificacao =
notificacoes.find(
item => item.id === id
);


if (notificacao)
notificacao.lida = true;


renderizarNotificacoes();

}



/* ==========================================
   EXCLUIR
========================================== */

async function excluirNotificacao(id) {


if (
!confirm(
"Deseja excluir esta notificação?"
)
)
return;


const { error } =

await banco

.from("notificacoes")

.delete()

.eq(
"id",
id
);


if (error) {

console.error(error);

alert(
"Não foi possível excluir a notificação."
);

return;

}


notificacoes =
notificacoes.filter(
item => item.id !== id
);


renderizarNotificacoes();

}



/* ==========================================
   FILTROS
========================================== */

document
.querySelectorAll(".filtro")
.forEach(botao => {


botao.addEventListener(
"click",
() => {


filtroAtual =
botao.dataset.filtro;


document
.querySelectorAll(".filtro")
.forEach(item =>

item.classList.toggle(
"active",
item === botao
)

);


renderizarNotificacoes();

}

);

});



/* ==========================================
   ATUALIZAÇÃO AUTOMÁTICA
========================================== */

setInterval(
carregarNotificacoes,
30000
);



/* ==========================================
   INICIAR
========================================== */

carregarNotificacoes();

</script>

</body>

</html>
