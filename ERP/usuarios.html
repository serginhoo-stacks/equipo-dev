<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Usuários - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">

<style>

.usuario-card{

background:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
display:flex;
align-items:center;
gap:15px;
box-shadow:0 3px 10px #0002;

}


.avatar{

width:55px;
height:55px;
border-radius:50%;
background:#0066cc;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;

}



.info{

flex:1;
display:flex;
flex-direction:column;

}


.status{

padding:5px 10px;
border-radius:20px;
font-size:13px;
width:max-content;

}


.ativo{

background:#d1fae5;
color:green;

}


.pendente{

background:#fff3cd;
color:#856404;

}


.bloqueado{

background:#f8d7da;
color:red;

}


button{

margin:3px;

}



</style>

</head>



<body>


<div class="menu-container"></div>




<div class="content">


<h1>👥 Controle de Usuários</h1>

<p>
Aprovação e gerenciamento de acessos
</p>




<div class="card">


<h3>

📊 Resumo

</h3>


<p>

Usuários:
<b id="totalUsuarios">0</b>

</p>


<p>

Pendentes:
<b id="usuariosPendentes">0</b>

</p>



</div>






<div class="card">


<input

id="buscaEquipe"

placeholder="🔎 Buscar usuário..."

>



<br><br>


<button onclick="filtro='todos';renderizar()">

Todos

</button>


<button onclick="filtro='pendente';renderizar()">

Pendentes

</button>


<button onclick="filtro='ativo';renderizar()">

Ativos

</button>


</div>







<div id="listaUsuarios">


Carregando usuários...

</div>




<p id="mensagemEquipe"></p>



</div>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/configuracoes.js"></script>
<script src="js/auth.js"></script>

<script src="js/sidebar.js"></script>



<script>


verificarLogin();



let usuarios=[];


let filtro="todos";


let usuarioAtual =
JSON.parse(localStorage.getItem("usuario"));



let admin =
usuarioAtual?.nivel_acesso==="adm";



const niveis=[

"adm",

"engenheiro",

"inspetor",

"tecnico",

"usuario"

];





async function carregarUsuarios(){



const {data,error}=await banco

.from("usuarios")

.select("*")

.order("id",{ascending:false});




if(error){

console.log(error);

alert("Erro ao carregar usuários");

return;

}



usuarios=data || [];

renderizar();


}






function renderizar(){



let busca =

document.getElementById("buscaEquipe")

.value

.toLowerCase();





document.getElementById("totalUsuarios")

.innerHTML=

usuarios.length;





document.getElementById("usuariosPendentes")

.innerHTML=

usuarios.filter(

u=>u.status==="pendente"

).length;







let lista =

document.getElementById("listaUsuarios");



lista.innerHTML="";







usuarios

.filter(u=>{


let nome =

(u.nome+" "+u.email)

.toLowerCase();



if(!nome.includes(busca))

return false;



if(filtro==="todos")

return true;



return u.status===filtro;



})


.forEach(u=>{



lista.innerHTML += `



<div class="usuario-card">



<div class="avatar">

${u.nome?.charAt(0) || "?"}

</div>




<div class="info">


<strong>

${u.nome || "Sem nome"}

</strong>


<span>

${u.email}

</span>



<span class="status ${u.status}">

${u.status || "ativo"}

</span>


</div>





<select

onchange="alterarCargo(${u.id},this.value)"

${admin?"":"disabled"}

>


${niveis.map(n=>`

<option value="${n}"

${n===u.nivel_acesso?"selected":""}>

${n}

</option>

`).join("")}



</select>






${u.status==="pendente" && admin ? `


<button onclick="aceitarUsuario(${u.id})">

✅ Aceitar

</button>



<button onclick="bloquearUsuario(${u.id})">

❌ Recusar

</button>



`:''}





${u.status==="ativo" && admin ? `


<button onclick="bloquearUsuario(${u.id})">

🚫 Bloquear

</button>


`:''}



</div>



`;



});




}







async function alterarCargo(id,cargo){


if(!admin)return;



const {error}=await banco

.from("usuarios")

.update({

nivel_acesso:cargo

})

.eq("id",id);



if(error){

alert("Erro ao alterar cargo");

return;

}



document.getElementById("mensagemEquipe")

.innerHTML=

"✅ Cargo atualizado";



carregarUsuarios();



}








async function aceitarUsuario(id){



const {error}=await banco

.from("usuarios")

.update({

status:"ativo",

nivel_acesso:"usuario"

})

.eq("id",id);




if(error){

console.log(error);

alert("Erro ao aceitar");

return;

}



alert("✅ Usuário aprovado!");

carregarUsuarios();


}









async function bloquearUsuario(id){



const {error}=await banco

.from("usuarios")

.update({

status:"bloqueado"

})

.eq("id",id);




if(error){

console.log(error);

alert("Erro ao bloquear");

return;

}



alert("Usuário bloqueado");

carregarUsuarios();


}







document

.getElementById("buscaEquipe")

.addEventListener(

"input",

renderizar

);







carregarUsuarios();



</script>



</body>

</html>
