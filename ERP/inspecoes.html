<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Consulte as inspeções realizadas nas obras cadastradas.">
    <title>Inspeções - SmartInspect AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../imagens/favicon.png">
</head>
<body class="erp-page--inspecoes">
    <div class="menu-container"></div>

    <main class="content erp-ui-shell">
        <header class="erp-ui-page-heading">
            <div class="erp-ui-title-lockup">
                <span class="erp-ui-icon-tile" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
                </span>
                <div>
                    <p class="erp-ui-page-kicker">REGISTRO TÉCNICO</p>
                    <h1>Inspeções</h1>
                    <p class="erp-ui-page-lead">Acompanhe as inspeções realizadas nas obras cadastradas.</p>
                </div>
            </div>
            <button id="btnNovaInspecao" class="erp-ui-button erp-ui-button--primary" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
                <span>Nova inspeção</span>
            </button>
        </header>

        <p id="inspecoesFeedback" class="erp-ui-feedback" role="status" aria-live="polite"></p>
        <section id="listaInspecoes" class="erp-inspection-list" aria-label="Inspeções cadastradas" aria-live="polite">
            <p class="erp-ui-empty-state">Carregando inspeções…</p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/sidebar.js"></script>

    <script>
        "use strict";

        const lista = document.getElementById("listaInspecoes");
        const feedback = document.getElementById("inspecoesFeedback");

        function criarElemento(tag, className, texto) {
            const elemento = document.createElement(tag);
            if (className) elemento.className = className;
            if (texto !== undefined) elemento.textContent = texto;
            return elemento;
        }

        function criarIcone(tipo) {
            const desenhos = {
                inspecao: '<rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path>',
                obra: '<path d="M3 21h18M5 21V7l7-4 7 4v14M9 10h1m4 0h1m-6 4h1m4 0h1m-5 7v-4h4v4"></path>',
                tipo: '<path d="M12 3v18m9-9H3"></path><circle cx="12" cy="12" r="9"></circle>',
                pessoa: '<path d="M20 21a8 8 0 0 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path>',
                data: '<rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 11h18"></path>',
                observacao: '<path d="M4 4h16v13H8l-4 4z"></path><path d="M8 9h8M8 13h5"></path>',
                ver: '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle>'
            };
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", "0 0 24 24");
            svg.setAttribute("aria-hidden", "true");
            svg.innerHTML = desenhos[tipo] || "";
            return svg;
        }

        function formatarData(valor) {
            if (!valor) return "Não informada";
            const texto = String(valor);
            const iso = texto.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (iso) return `${iso[3]}/${iso[2]}/${iso[1]}`;
            const data = new Date(texto);
            return Number.isNaN(data.getTime()) ? texto : new Intl.DateTimeFormat("pt-BR").format(data);
        }

        function criarCampo(tipo, rotulo, valor) {
            const campo = document.createElement("div");
            const titulo = document.createElement("dt");
            titulo.append(criarIcone(tipo), document.createTextNode(rotulo));
            campo.append(titulo, criarElemento("dd", "", valor || "Não informado"));
            return campo;
        }

        function criarCardInspecao(inspecao) {
            const card = criarElemento("article", "card erp-inspection-card");
            const cabecalho = criarElemento("div", "erp-inspection-card-heading");
            const tituloBox = criarElemento("div", "erp-inspection-title-box");
            const icone = criarElemento("span", "erp-inspection-icon");
            icone.setAttribute("aria-hidden", "true");
            icone.append(criarIcone("inspecao"));
            const titulo = criarElemento("h2", "", `Inspeção #${inspecao.id}`);
            tituloBox.append(icone, titulo);
            cabecalho.append(tituloBox, criarElemento("span", "erp-ui-status", inspecao.status || "Pendente"));

            const obra = Array.isArray(inspecao.obras) ? inspecao.obras[0] : inspecao.obras;
            const metadados = document.createElement("dl");
            metadados.className = "erp-inspection-meta";
            metadados.append(
                criarCampo("obra", "Obra", obra?.nome || "Sem obra vinculada"),
                criarCampo("tipo", "Tipo", inspecao.tipo),
                criarCampo("pessoa", "Responsável", inspecao.responsavel),
                criarCampo("data", "Data", formatarData(inspecao.data_inspecao))
            );

            card.append(cabecalho, metadados);
            if (inspecao.observacao) {
                const observacao = criarElemento("p", "erp-inspection-observation");
                observacao.append(criarIcone("observacao"), document.createTextNode(inspecao.observacao));
                card.append(observacao);
            }

            const acoes = criarElemento("div", "erp-ui-card-actions");
            const ver = criarElemento("button", "erp-ui-button erp-ui-button--secondary");
            ver.type = "button";
            ver.dataset.action = "ver";
            ver.dataset.id = String(inspecao.id);
            ver.append(criarIcone("ver"), document.createTextNode("Ver detalhes"));
            acoes.append(ver);
            card.append(acoes);
            return card;
        }

        function mostrarEstado(texto) {
            lista.replaceChildren(criarElemento("p", "erp-ui-empty-state", texto));
        }

        async function carregarInspecoes() {
            mostrarEstado("Carregando inspeções…");
            feedback.textContent = "";
            try {
                if (!window.banco?.from) throw new Error("Cliente Supabase indisponível.");
                const { data, error } = await window.banco
                    .from("inspecoes")
                    .select("id, obra_id, tipo, responsavel, data_inspecao, status, observacao, obras(nome)")
                    .order("id", { ascending: false });
                if (error) throw error;

                if (!Array.isArray(data) || data.length === 0) {
                    mostrarEstado("Nenhuma inspeção cadastrada ainda.");
                    return;
                }
                lista.replaceChildren(...data.map(criarCardInspecao));
            } catch (erro) {
                console.error("Erro ao carregar inspeções:", erro);
                mostrarEstado("Não foi possível carregar as inspeções.");
                feedback.textContent = "Confira sua conexão e tente atualizar a página.";
                feedback.className = "erp-ui-feedback is-error";
            }
        }

        document.getElementById("btnNovaInspecao").addEventListener("click", () => {
            window.location.href = "nova_inspecao.html";
        });

        lista.addEventListener("click", (evento) => {
            const botao = evento.target.closest('button[data-action="ver"]');
            if (!botao || !lista.contains(botao)) return;
            window.location.href = `detalhes_inspecao.html?id=${encodeURIComponent(botao.dataset.id)}`;
        });

        carregarInspecoes();
    </script>
</body>
</html>
