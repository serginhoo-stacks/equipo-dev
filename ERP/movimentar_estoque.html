<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registre entradas e saídas de materiais do estoque.">
    <title>Movimentar estoque - SmartInspect AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../imagens/favicon.png">
</head>
<body class="erp-page--movimentar-estoque">
    <div class="menu-container"></div>

    <main class="content erp-stock-shell">
        <header class="erp-stock-page-heading">
            <div class="erp-stock-title-lockup">
                <span class="erp-stock-icon-tile" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M7 7h13l-3-3m3 3-3 3M17 17H4l3 3m-3-3 3-3"></path></svg>
                </span>
                <div>
                    <p class="erp-stock-kicker">CONTROLE DE MATERIAIS</p>
                    <h1>Movimentar estoque</h1>
                    <p class="erp-stock-lead">Registre entradas ou saídas de materiais com segurança.</p>
                </div>
            </div>
            <a href="estoque.html" class="erp-stock-button erp-stock-button--secondary">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h12"></path></svg>
                <span>Voltar ao estoque</span>
            </a>
        </header>

        <p id="mensagemTopo" class="erp-stock-feedback" role="status" aria-live="polite"></p>

        <section class="card erp-stock-form-panel" id="formularioMovimentacao" hidden>
            <form id="formMovimentar">
                <div class="erp-stock-form-grid">
                    <label class="erp-stock-field">
                        <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5M12 22V12"></path></svg>Material</span>
                        <input id="materialNome" type="text" disabled>
                    </label>
                    <label class="erp-stock-field">
                        <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18m9-9H3"></path></svg>Quantidade atual</span>
                        <input id="quantidadeAtual" type="text" disabled>
                    </label>
                    <label class="erp-stock-field">
                        <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h13l-3-3m3 3-3 3M17 17H4l3 3m-3-3 3-3"></path></svg>Tipo de movimentação</span>
                        <select id="tipo" required>
                            <option value="entrada">Entrada (adicionar)</option>
                            <option value="saida">Saída (remover)</option>
                        </select>
                    </label>
                    <label class="erp-stock-field">
                        <span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v10M7 12h10"></path></svg>Quantidade</span>
                        <input id="quantidade" type="number" min="1" step="1" required placeholder="Ex.: 10">
                    </label>
                    <label class="erp-stock-field">
                        <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path></svg>Responsável</span>
                        <input id="responsavel" type="text" maxlength="160" required placeholder="Nome do responsável">
                    </label>
                    <label class="erp-stock-field erp-stock-field--full">
                        <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v13H8l-4 4z"></path><path d="M8 9h8M8 13h5"></path></svg>Observação</span>
                        <textarea id="observacao" rows="4" placeholder="Motivo ou detalhes da movimentação"></textarea>
                    </label>
                </div>

                <div class="erp-stock-form-actions">
                    <a href="estoque.html" class="erp-stock-button erp-stock-button--secondary">Cancelar</a>
                    <button type="submit" class="erp-stock-button erp-stock-button--primary" id="btnSalvar">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12l4 4v14H3V3h2Zm2 0v6h10V3M7 21v-8h10v8"></path></svg>
                        <span id="btnSalvarTexto">Salvar movimentação</span>
                    </button>
                </div>
                <p id="mensagem" class="erp-stock-feedback" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section class="card erp-stock-state-card" id="carregando" aria-live="polite">
            <p>Carregando informações do material…</p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/sidebar.js"></script>

    <script>
        "use strict";

        const parametros = new URLSearchParams(window.location.search);
        const estoqueId = parametros.get("id");
        const $ = (id) => document.getElementById(id);
        let materialAtual = null;

        function mostrarMensagem(texto, tipo = "") {
            const elemento = $("mensagem");
            elemento.textContent = texto;
            elemento.className = `erp-stock-feedback ${tipo}`.trim();
        }

        function mostrarMensagemTopo(texto, tipo = "") {
            const elemento = $("mensagemTopo");
            elemento.textContent = texto;
            elemento.className = `erp-stock-feedback ${tipo}`.trim();
        }

        function formatarNumero(valor) {
            const numero = Number(valor);
            return new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 2 }).format(Number.isFinite(numero) ? numero : 0);
        }

        async function carregarMaterial() {
            if (!estoqueId) {
                $("carregando").textContent = "Nenhum material foi selecionado. Volte ao estoque e escolha um item.";
                return;
            }

            try {
                if (!window.banco?.from) throw new Error("Cliente Supabase indisponível.");
                const { data, error } = await window.banco.from("estoque").select("*").eq("id", estoqueId).single();
                if (error) throw error;
                if (!data) throw new Error("Material não encontrado.");

                materialAtual = data;
                $("materialNome").value = data.material || "Material sem nome";
                $("quantidadeAtual").value = `${formatarNumero(data.quantidade)} ${data.unidade || "un"}`;
                $("carregando").hidden = true;
                $("formularioMovimentacao").hidden = false;
            } catch (erro) {
                console.error("Erro ao carregar material:", erro);
                $("carregando").textContent = "Não foi possível carregar este material. Volte ao estoque e tente novamente.";
                mostrarMensagemTopo("Material indisponível ou erro de conexão.", "is-error");
            }
        }

        $("formMovimentar").addEventListener("submit", async (evento) => {
            evento.preventDefault();
            if (!materialAtual) {
                mostrarMensagem("Não há um material carregado para movimentar.", "is-error");
                return;
            }

            const botao = $("btnSalvar");
            const textoBotao = $("btnSalvarTexto");
            const tipo = $("tipo").value;
            const qtdMovimentada = Number($("quantidade").value);
            const quantidadeAtual = Number(materialAtual.quantidade || 0);

            if (!Number.isFinite(qtdMovimentada) || !Number.isInteger(qtdMovimentada) || qtdMovimentada <= 0) {
                mostrarMensagem("Informe uma quantidade inteira maior que zero.", "is-error");
                $("quantidade").focus();
                return;
            }

            let novaQuantidade = quantidadeAtual;
            if (tipo === "entrada") {
                novaQuantidade += qtdMovimentada;
            } else if (tipo === "saida") {
                if (qtdMovimentada > quantidadeAtual) {
                    mostrarMensagem("A quantidade de saída não pode ser maior que o saldo atual.", "is-error");
                    $("quantidade").focus();
                    return;
                }
                novaQuantidade -= qtdMovimentada;
            }

            botao.disabled = true;
            textoBotao.textContent = "Salvando…";
            mostrarMensagem("");
            mostrarMensagemTopo("");

            try {
                const { error: erroUpdate } = await window.banco
                    .from("estoque")
                    .update({ quantidade: novaQuantidade })
                    .eq("id", estoqueId);
                if (erroUpdate) throw erroUpdate;

                materialAtual.quantidade = novaQuantidade;
                $("quantidadeAtual").value = `${formatarNumero(novaQuantidade)} ${materialAtual.unidade || "un"}`;

                const { error: erroLog } = await window.banco.from("movimentacoes_estoque").insert([{
                    estoque_id: estoqueId,
                    tipo,
                    quantidade: qtdMovimentada,
                    responsavel: $("responsavel").value.trim(),
                    observacao: $("observacao").value.trim() || null
                }]);

                if (erroLog) {
                    console.error("Saldo atualizado, mas houve falha ao registrar o histórico:", erroLog);
                    mostrarMensagem("O saldo foi atualizado, mas o histórico não foi registrado. Evite repetir esta movimentação e confira a tabela movimentacoes_estoque.", "is-warning");
                } else {
                    mostrarMensagem("Movimentação registrada com sucesso.", "is-success");
                }

                textoBotao.textContent = "Movimentação concluída";
                window.setTimeout(() => { window.location.href = "estoque.html"; }, erroLog ? 2400 : 1400);
            } catch (erro) {
                console.error("Erro ao atualizar movimentação:", erro);
                mostrarMensagem("Não foi possível atualizar o estoque. Confira a conexão e tente novamente.", "is-error");
                botao.disabled = false;
                textoBotao.textContent = "Salvar movimentação";
            }
        });

        carregarMaterial();
    </script>
</body>
</html>
