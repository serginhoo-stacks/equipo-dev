<head>

<title>Movimentar Estoque - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="menu-container"></div>

<main class="content">

```
<div class="page-header">

    <div>
        <p class="eyebrow">CONTROLE DE ESTOQUE</p>

        <h1>📦 Movimentar estoque</h1>

        <p class="subtitle">
            Registre entradas e saídas de materiais.
        </p>
    </div>

    <a href="estoque.html" class="secondary-button">
        ← Voltar
    </a>

</div>


<!-- ==========================================
     FORMULÁRIO
=========================================== -->

<section class="card">

    <div class="panel-heading">

        <div>
            <p class="eyebrow">MOVIMENTAÇÃO</p>

            <h2>Registrar movimentação</h2>
        </div>

    </div>


    <form id="formMovimentacao">

        <label>
            📦 Material

            <select id="estoqueId" required>

                <option value="">
                    Carregando materiais...
                </option>

            </select>

        </label>


        <br>


        <div
            id="resumoMovimentacao"
            class="card"
            style="margin:20px 0;">

            Selecione um material.

        </div>


        <div class="form-grid">

            <label>
                Tipo

                <select id="tipo" required>

                    <option value="entrada">
                        ➕ Entrada
                    </option>

                    <option value="saida">
                        ➖ Saída
                    </option>

                </select>

            </label>


            <label>
                Quantidade

                <input
                    id="quantidade"
                    type="number"
                    min="0.01"
                    step="0.01"
                    required
                    placeholder="Ex.: 10">

            </label>


            <label>
                Motivo

                <input
                    id="motivo"
                    type="text"
                    placeholder="Ex.: Compra de material">

            </label>


            <label>
                Fornecedor

                <input
                    id="fornecedor"
                    type="text"
                    placeholder="Nome do fornecedor">

            </label>


            <label>
                Destino

                <input
                    id="destino"
                    type="text"
                    placeholder="Ex.: Obra / etapa">

            </label>


            <label>
                Responsável

                <input
                    id="responsavel"
                    type="text"
                    readonly>

            </label>


            <label class="full-field">

                Observação

                <textarea
                    id="observacao"
                    rows="4"
                    placeholder="Observações sobre a movimentação"></textarea>

            </label>


            <label class="full-field">

                ✍️ Assinatura do responsável

                <input
                    id="assinatura"
                    type="text"
                    placeholder="Digite seu nome para confirmar"
                    required>

            </label>

        </div>


        <div class="form-actions">

            <a
                href="estoque.html"
                class="secondary-button">

                Cancelar

            </a>


            <button
                type="submit"
                class="primary-button"
                id="salvarMovimentacao">

                💾 Confirmar movimentação

            </button>

        </div>


        <p
            id="mensagem"
            class="dashboard-message">
        </p>


    </form>

</section>


<!-- ==========================================
     HISTÓRICO
=========================================== -->

<section class="card">

    <div class="panel-heading">

        <div>

            <p class="eyebrow">
                HISTÓRICO
            </p>

            <h2>
                Últimas movimentações
            </h2>

        </div>

    </div>


    <div id="historico">

        Carregando histórico...

    </div>

</section>
```

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/configuracoes.js"></script>
<script src="js/auth.js"></script>

<script src="js/sidebar.js"></script>

<script>

verificarLogin();


const $ = id => document.getElementById(id);


let materiais = [];


const usuario = getUsuario();


// ==========================================
// RESPONSÁVEL
// ==========================================

const nomeResponsavel =
    usuario?.nome ||
    usuario?.email ||
    "Usuário";


$("responsavel").value =
    nomeResponsavel;


// ==========================================
// CARREGAR MATERIAIS
// ==========================================

async function carregarMateriais() {

    const select = $("estoqueId");


    const { data, error } =
        await banco
            .from("estoque")
            .select("*")
            .order("material", {
                ascending: true
            });


    if (error) {

        console.error(
            "Erro ao carregar materiais:",
            error
        );


        select.innerHTML = `
            <option value="">
                ❌ Erro ao carregar materiais
            </option>
        `;

        return;

    }


    materiais = data || [];


    if (!materiais.length) {

        select.innerHTML = `
            <option value="">
                Nenhum material cadastrado
            </option>
        `;

        return;

    }


    select.innerHTML = `
        <option value="">
            Selecione um material
        </option>
    `;


    materiais.forEach(item => {

        const option =
            document.createElement("option");


        option.value = item.id;


        option.textContent =
            `${item.material || "Material sem nome"} — estoque: ${item.quantidade || 0} ${item.unidade || "un"}`;


        select.appendChild(option);

    });

}


// ==========================================
// MOSTRAR RESUMO
// ==========================================

function atualizarResumo() {

    const id =
        $("estoqueId").value;


    const material =
        materiais.find(
            item =>
                String(item.id) === String(id)
        );


    if (!material) {

        $("resumoMovimentacao").innerHTML =
            "Selecione um material.";

        return;

    }


    const quantidadeAtual =
        Number(material.quantidade || 0);


    const estoqueMinimo =
        Number(material.estoque_minimo || 0);


    let alerta = "";


    if (quantidadeAtual <= estoqueMinimo) {

        alerta = `
            <br><br>
            <strong>
                ⚠️ Estoque abaixo ou no mínimo.
            </strong>
        `;

    }


    $("resumoMovimentacao").innerHTML = `

        <strong>
            📦 ${material.material || "Material sem nome"}
        </strong>

        <br><br>

        Estoque atual:

        <strong>
            ${quantidadeAtual}
            ${material.unidade || "un"}
        </strong>

        <br>

        Estoque mínimo:

        <strong>
            ${estoqueMinimo}
            ${material.unidade || "un"}
        </strong>

        ${alerta}

    `;

}


$("estoqueId")
    .addEventListener(
        "change",
        atualizarResumo
    );


// ==========================================
// ENVIAR MOVIMENTAÇÃO
// ==========================================

$("formMovimentacao")
    .addEventListener(
        "submit",
        async evento => {

            evento.preventDefault();


            const botao =
                $("salvarMovimentacao");


            const mensagem =
                $("mensagem");


            const estoqueId =
                Number(
                    $("estoqueId").value
                );


            const tipo =
                $("tipo").value;


            const quantidade =
                Number(
                    $("quantidade").value
                );


            const assinatura =
                $("assinatura")
                    .value
                    .trim();


            // ==================================
            // VALIDAÇÕES
            // ==================================

            if (!estoqueId) {

                mensagem.textContent =
                    "❌ Selecione um material.";

                return;

            }


            if (
                !quantidade ||
                quantidade <= 0
            ) {

                mensagem.textContent =
                    "❌ Informe uma quantidade válida.";

                return;

            }


            if (!assinatura) {

                mensagem.textContent =
                    "❌ Informe sua assinatura.";

                return;

            }


            if (
                assinatura.toLowerCase() !==
                String(
                    nomeResponsavel
                ).toLowerCase()
            ) {

                mensagem.textContent =
                    "❌ A assinatura deve corresponder ao responsável.";

                return;

            }


            // ==================================
            // MATERIAL
            // ==================================

            const material =
                materiais.find(
                    item =>
                        Number(item.id) ===
                        estoqueId
                );


            if (!material) {

                mensagem.textContent =
                    "❌ Material não encontrado.";

                return;

            }


            const estoqueAtual =
                Number(
                    material.quantidade || 0
                );


            // ==================================
            // VERIFICAR SAÍDA
            // ==================================

            if (
                tipo === "saida" &&
                quantidade > estoqueAtual
            ) {

                mensagem.textContent =
                    `❌ Estoque insuficiente. Disponível: ${estoqueAtual} ${material.unidade || "un"}.`;

                return;

            }


            botao.disabled = true;

            botao.textContent =
                "Processando...";


            mensagem.textContent = "";


            try {

                // ==================================
                // UUID CORRETO DO USUÁRIO
                // ==================================

                const responsavelAuthId =
                    usuario?.auth_id || null;


                // ==================================
                // CHAMAR RPC
                // ==================================

                const { data, error } =
                    await banco.rpc(
                        "movimentar_estoque",
                        {

                            p_estoque_id:
                                estoqueId,

                            p_tipo:
                                tipo,

                            p_quantidade:
                                quantidade,

                            p_motivo:
                                $("motivo")
                                    .value
                                    .trim() ||
                                null,

                            p_fornecedor:
                                $("fornecedor")
                                    .value
                                    .trim() ||
                                null,

                            p_destino:
                                $("destino")
                                    .value
                                    .trim() ||
                                null,

                            p_responsavel_id:
                                responsavelAuthId,

                            p_responsavel_nome:
                                nomeResponsavel,

                            p_assinatura:
                                assinatura,

                            p_observacao:
                                $("observacao")
                                    .value
                                    .trim() ||
                                null

                        }
                    );


                if (error) {

                    throw error;

                }


                mensagem.textContent =
                    "✅ Movimentação registrada com sucesso!";


                // ==================================
                // LIMPAR CAMPOS
                // ==================================

                $("quantidade").value = "";

                $("motivo").value = "";

                $("fornecedor").value = "";

                $("destino").value = "";

                $("observacao").value = "";

                $("assinatura").value = "";


                // ==================================
                // ATUALIZAR
                // ==================================

                await carregarMateriais();

                atualizarResumo();

                await carregarHistorico();


            }
            catch (erro) {

                console.error(
                    "Erro na movimentação:",
                    erro
                );


                mensagem.textContent =
                    "❌ " +
                    (
                        erro.message ||
                        "Não foi possível registrar a movimentação."
                    );

            }
            finally {

                botao.disabled = false;

                botao.textContent =
                    "💾 Confirmar movimentação";

            }

        }
    );


// ==========================================
// HISTÓRICO
// ==========================================

async function carregarHistorico() {

    const { data, error } =
        await banco
            .from("movimentacoes_estoque")
            .select(`
                *,
                estoque (
                    material,
                    unidade
                )
            `)
            .order(
                "data_movimentacao",
                {
                    ascending: false
                }
            )
            .limit(20);


    if (error) {

        console.error(
            "Erro ao carregar histórico:",
            error
        );


        $("historico").innerHTML =
            "❌ Não foi possível carregar o histórico.";

        return;

    }


    if (!data?.length) {

        $("historico").innerHTML =
            "Nenhuma movimentação registrada.";

        return;

    }


    $("historico").innerHTML =
        data.map(item => {

            const entrada =
                item.tipo === "entrada";


            return `

                <div
                    class="card"
                    style="margin-bottom:10px;">

                    <strong>

                        ${
                            entrada
                            ? "➕ Entrada"
                            : "➖ Saída"
                        }

                        —

                        ${item.estoque?.material || "Material"}

                    </strong>


                    <p>

                        Quantidade:

                        <strong>
                            ${item.quantidade}
                            ${item.estoque?.unidade || "un"}
                        </strong>

                    </p>


                    <p>

                        Responsável:

                        ${item.responsavel_nome || "-"}

                    </p>


                    <p>

                        Motivo:

                        ${item.motivo || "-"}

                    </p>


                    ${
                        item.destino
                        ? `
                            <p>
                                Destino:
                                ${item.destino}
                            </p>
                        `
                        : ""
                    }


                    ${
                        item.fornecedor
                        ? `
                            <p>
                                Fornecedor:
                                ${item.fornecedor}
                            </p>
                        `
                        : ""
                    }


                    ${
                        item.assinatura
                        ? `
                            <p>
                                ✍️ Assinatura:
                                ${item.assinatura}
                            </p>
                        `
                        : ""
                    }


                    ${
                        item.observacao
                        ? `
                            <p>
                                Observação:
                                ${item.observacao}
                            </p>
                        `
                        : ""
                    }


                    <small>

                        ${
                            item.data_movimentacao
                            ? new Date(
                                item.data_movimentacao
                              ).toLocaleString("pt-BR")
                            : "-"
                        }

                    </small>

                </div>

            `;

        }).join("");

}


// ==========================================
// INICIAR
// ==========================================

carregarMateriais();

carregarHistorico();

</script>

</body>

</html>
