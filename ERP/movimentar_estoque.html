<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movimentar Estoque - SmartInspect AI</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="erp-page--movimentar-estoque">

<div class="menu-container"></div>

<main class="content">
    <header class="page-header">
        <div>
            <p class="eyebrow">CONTROLE DE MATERIAIS</p>
            <h1>🔄 Movimentar Estoque</h1>
            <p class="subtitle">Registre entradas ou saídas de materiais.</p>
        </div>
        <a href="estoque.html" class="secondary-button">← Voltar ao Estoque</a>
    </header>

    <section class="card" id="formularioMovimentacao" hidden>
        <form id="formMovimentar">
            <label>Material
                <input id="materialNome" type="text" disabled>
            </label>
            <label>Quantidade Atual
                <input id="quantidadeAtual" type="text" disabled>
            </label>
            
            <label>Tipo de Movimentação
                <select id="tipo" required>
                    <option value="entrada">🟢 Entrada (Adicionar)</option>
                    <option value="saida">🔴 Saída (Remover)</option>
                </select>
            </label>
            
            <label>Quantidade
                <input id="quantidade" type="number" min="1" required placeholder="Ex: 10">
            </label>
            
            <label>Responsável
                <input id="responsavel" type="text" required placeholder="Seu nome">
            </label>

            <label>Observação
                <textarea id="observacao" rows="3" placeholder="Motivo da movimentação..."></textarea>
            </label>

            <br>
            <button type="submit" class="primary-button" id="btnSalvar">💾 Salvar Movimentação</button>
            <p id="mensagem" class="erp-message-inline"></p>
        </form>
    </section>
    
    <div class="card" id="carregando">
        <p>⏳ Carregando informações do material...</p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/sidebar.js"></script>

<script>
    const parametros = new URLSearchParams(window.location.search);
    const estoqueId = parametros.get("id");
    const $ = id => document.getElementById(id);

    let materialAtual = null;

    async function carregarMaterial() {
        if (!estoqueId) {
            alert("Nenhum material selecionado.");
            window.location.href = "estoque.html";
            return;
        }

        const { data, error } = await banco.from("estoque").select("*").eq("id", estoqueId).single();

        if (error || !data) {
            alert("Material não encontrado.");
            window.location.href = "estoque.html";
            return;
        }

        materialAtual = data;
        $("materialNome").value = data.material;
        $("quantidadeAtual").value = `${data.quantidade} ${data.unidade || 'un'}`;
        
        $("carregando").hidden = true;
        $("formularioMovimentacao").hidden = false;
    }

    $("formMovimentar").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = $("btnSalvar");
        btn.disabled = true;
        btn.textContent = "Salvando...";
        $("mensagem").textContent = "";

        const tipo = $("tipo").value;
        const qtdMovimentada = Number($("quantidade").value);
        
        if (qtdMovimentada <= 0) {
            $("mensagem").textContent = "A quantidade deve ser maior que zero.";
            btn.disabled = false; btn.textContent = "💾 Salvar Movimentação";
            return;
        }

        let novaQuantidade = Number(materialAtual.quantidade || 0);

        if (tipo === "entrada") {
            novaQuantidade += qtdMovimentada;
        } else {
            if (qtdMovimentada > novaQuantidade) {
                $("mensagem").textContent = "Você não pode remover mais do que tem em estoque.";
                btn.disabled = false; btn.textContent = "💾 Salvar Movimentação";
                return;
            }
            novaQuantidade -= qtdMovimentada;
        }

        // 1. Atualiza a tabela de estoque
        const { error: erroUpdate } = await banco.from("estoque").update({ quantidade: novaQuantidade }).eq("id", estoqueId);

        if (erroUpdate) {
            $("mensagem").textContent = "Erro ao atualizar o estoque: " + erroUpdate.message;
            btn.disabled = false; btn.textContent = "💾 Salvar Movimentação";
            return;
        }

        // 2. Tenta registrar no log (se a tabela existir)
        await banco.from("movimentacoes_estoque").insert([{
            estoque_id: estoqueId,
            tipo: tipo,
            quantidade: qtdMovimentada,
            responsavel: $("responsavel").value,
            observacao: $("observacao").value
        }]);

        $("mensagem").textContent = "✅ Movimentação realizada com sucesso!";
        $("mensagem").style.color = "#16a36a";
        
        setTimeout(() => {
            window.location.href = "estoque.html";
        }, 1500);
    });

    carregarMaterial();
</script>

</body>
</html>
