```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Solicitações - SmartInspect AI</title>

<link rel="stylesheet" href="../css/style.css">



</head>


<body class="erp-page--solicitacoes">
<div class="menu-container"></div>







<div class="content">


<h1>👤 Solicitações de Acesso</h1>

<p>

Aprovação de novos usuários do SmartInspect AI

</p>



<div id="listaSolicitacoes">

Carregando solicitações...

</div>


<p id="mensagem"></p>


</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>

<script src="../js/configuracoes.js"></script>
<script src="../js/auth.js"></script>

<script src="../js/sidebar.js"></script>



<script>

verificarLogin();



const usuarioLogado =
JSON.parse(localStorage.getItem("usuario"));



/*
==================================================
VERIFICAÇÃO DO ADMINISTRADOR
==================================================
*/

if (
!usuarioLogado ||
usuarioLogado.nivel_acesso !== "adm"
) {

alert("❌ Você não tem permissão para acessar esta área.");

window.location.href = "index.html";

}



/*
==================================================
CARREGAR SOLICITAÇÕES
==================================================
*/

async function carregarSolicitacoes() {


const lista =
document.getElementById("listaSolicitacoes");


lista.innerHTML =
"🔄 Carregando solicitações...";



const { data, error } = await banco

.from("usuarios")

.select("*")

.eq("status", "pendente")

.order("id", { ascending: false });



if (error) {

console.error(error);

lista.innerHTML = `

<div class="vazio">

❌ Erro ao carregar solicitações.

<br><br>

${error.message}

</div>

`;

return;

}



if (!data || data.length === 0) {

lista.innerHTML = `

<div class="vazio">

<h2>✅ Tudo certo!</h2>

<p>

Não existem solicitações pendentes.

</p>

</div>

`;

return;

}



lista.innerHTML = "";



data.forEach(usuario => {


lista.innerHTML += `

<div class="solicitacao-card">


<h2>

👤 ${usuario.nome || "Sem nome"}

</h2>


<p>

📧 <strong>E-mail:</strong>

${usuario.email || "Não informado"}

</p>


<p>

📌 <strong>Status atual:</strong>

${usuario.status || "pendente"}

</p>


<p>

🎫 <strong>Cargo solicitado:</strong>

${usuario.nivel_acesso || "usuario"}

</p>



<label>

<strong>Definir nível de acesso:</strong>

</label>



<select

class="cargo-select"

id="cargo_${usuario.id}"

>


<option value="usuario"

${usuario.nivel_acesso === "usuario" ? "selected" : ""}>

👤 Usuário

</option>


<option value="tecnico"

${usuario.nivel_acesso === "tecnico" ? "selected" : ""}>

🔧 Técnico

</option>


<option value="inspetor"

${usuario.nivel_acesso === "inspetor" ? "selected" : ""}>

🔍 Inspetor

</option>


<option value="engenheiro"

${usuario.nivel_acesso === "engenheiro" ? "selected" : ""}>

👷 Engenheiro

</option>


<option value="adm"

${usuario.nivel_acesso === "adm" ? "selected" : ""}>

👑 Administrador

</option>


</select>



<div class="acoes">


<button

class="btn-aprovar"

onclick="aceitarUsuario(${usuario.id})">

✅ Aprovar cadastro

</button>



<button

class="btn-recusar"

onclick="recusarUsuario(${usuario.id})">

❌ Recusar

</button>


</div>


</div>

`;

});


}



/*
==================================================
APROVAR USUÁRIO
==================================================
*/

async function aceitarUsuario(id) {


const select =
document.getElementById("cargo_" + id);


if (!select) {

alert("❌ Não foi possível encontrar o cargo.");

return;

}



const cargo = select.value;



const confirmar = confirm(

" Aprovar este usuário como " +
cargo +
"?"

);


if (!confirmar) {

return;

}



const { data, error } = await banco

.from("usuarios")

.update({

status: "ativo",

nivel_acesso: cargo

})

.eq("id", id)

.select();



console.log("Resultado aprovação:", data);

console.log("Erro aprovação:", error);



if (error) {

console.error(error);

alert(

"❌ Não foi possível aprovar o usuário:\n\n" +
error.message

);

return;

}



alert(

"✅ Cadastro aprovado!\n\n" +
"Cargo definido: " +
cargo

);



carregarSolicitacoes();

}



/*
==================================================
RECUSAR USUÁRIO
==================================================
*/

async function recusarUsuario(id) {


const confirmar = confirm(

"Deseja realmente recusar este cadastro?"

);



if (!confirmar) {

return;

}



const { data, error } = await banco

.from("usuarios")

.update({

status: "recusado"

})

.eq("id", id)

.select();



console.log("Resultado recusa:", data);

console.log("Erro recusa:", error);



if (error) {

console.error(error);

alert(

"❌ Não foi possível recusar o cadastro:\n\n" +
error.message

);

return;

}



alert("❌ Cadastro recusado.");



carregarSolicitacoes();

}



/*
==================================================
INICIAR
==================================================
*/

carregarSolicitacoes();

</script>


</body>

</html>
```
