<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Histórico de entradas e saídas de materiais do estoque.">
    <title>Histórico do estoque - SmartInspect AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../imagens/favicon.png">
</head>
<body class="erp-page--logs-estoque">
    <div class="menu-container"></div>

    <main class="content erp-stock-shell">
        <header class="erp-stock-page-heading">
            <div class="erp-stock-title-lockup">
                <span class="erp-stock-icon-tile" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg>
                </span>
                <div>
                    <p class="erp-stock-kicker">HISTÓRICO DE MOVIMENTAÇÕES</p>
                    <h1>Histórico do material</h1>
                    <p class="erp-stock-lead">Acompanhe todas as entradas e saídas deste item.</p>
                </div>
            </div>
            <a href="estoque.html" class="erp-stock-button erp-stock-button--secondary">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h12"></path></svg>
                <span>Voltar ao estoque</span>
            </a>
        </header>

        <section id="infoMaterial" class="card erp-stock-summary" hidden aria-live="polite">
            <span class="erp-stock-icon-tile" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5M12 22V12"></path></svg>
            </span>
            <div class="erp-stock-summary-copy">
                <p class="erp-stock-kicker">MATERIAL SELECIONADO</p>
                <h2 id="nomeMaterial" class="erp-stock-summary-title"></h2>
                <p id="saldoMaterial" class="erp-stock-summary-balance"></p>
            </div>
        </section>

        <section id="listaLogs" class="card erp-stock-log-list" aria-label="Movimentações do material" aria-live="polite">
            <p class="erp-stock-empty">Carregando histórico…</p>
        </section>
        <p id="logsFeedback" class="erp-stock-feedback" role="status" aria-live="polite"></p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/sidebar.js"></script>

    <script>
        "use strict";

        const parametros = new URLSearchParams(window.location.search);
        const estoqueId = parametros.get("id");
        const lista = document.getElementById("listaLogs");
        const feedback = document.getElementById("logsFeedback");
        const infoMaterial = document.getElementById("infoMaterial");

        function criarElemento(tag, className = "", texto) {
            const elemento = document.createElement(tag);
            if (className) elemento.className = className;
            if (texto !== undefined) elemento.textContent = texto;
            return elemento;
        }

        function criarIcone(tipo) {
            const desenhos = {
                entrada: '<path d="M12 19V5m-7 7 7-7 7 7"></path>',
                saida: '<path d="M12 5v14m7-7-7 7-7-7"></path>',
                calendario: '<rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 11h18"></path>',
                responsavel: '<path d="M20 21a8 8 0 0 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path>',
                observacao: '<path d="M4 4h16v13H8l-4 4z"></path><path d="M8 9h8M8 13h5"></path>'
            };
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.setAttribute("viewBox", "0 0 24 24");
            svg.setAttribute("aria-hidden", "true");
            svg.innerHTML = desenhos[tipo] || "";
            return svg;
        }

        function formatarData(valor) {
            if (!valor) return "Data não informada";
            const data = new Date(valor);
            return Number.isNaN(data.getTime()) ? String(valor) : new Intl.DateTimeFormat("pt-BR", { dateStyle: "short", timeStyle: "short" }).format(data);
        }

        function mostrarEstado(texto) {
            lista.replaceChildren(criarElemento("p", "erp-stock-empty", texto));
        }

        function montarDetalhe(tipo, rotulo, valor) {
            const linha = criarElemento("p", "erp-stock-log-detail");
            linha.append(criarIcone(tipo), criarElemento("strong", "", `${rotulo}: `), document.createTextNode(valor));
            return linha;
        }

        function criarLinhaLog(log) {
            const entrada = log.tipo === "entrada";
            const linha = criarElemento("article", "erp-stock-log-row");
            const tipo = criarElemento("span", `erp-stock-log-type ${entrada ? "is-entry" : "is-exit"}`);
            tipo.append(criarIcone(entrada ? "entrada" : "saida"), document.createTextNode(entrada ? "Entrada" : "Saída"));

            const conteudo = criarElemento("div", "erp-stock-log-content");
            const detalhes = criarElemento("div", "erp-stock-log-details");
            detalhes.append(
                montarDetalhe("calendario", "Data", formatarData(log.created_at)),
                montarDetalhe("responsavel", "Responsável", log.responsavel || "Não informado")
            );
            conteudo.append(
                criarElemento("p", "erp-stock-log-quantity", `Quantidade: ${log.quantidade ?? "Não informada"}`),
                detalhes
            );
            if (log.observacao) {
                const observacao = criarElemento("p", "erp-stock-log-observation");
                observacao.append(criarIcone("observacao"), document.createTextNode(log.observacao));
                conteudo.append(observacao);
            }
            linha.append(tipo, conteudo);
            return linha;
        }

        async function carregarLogs() {
            if (!estoqueId) {
                mostrarEstado("Nenhum material foi selecionado. Volte ao estoque e abra o histórico de um item.");
                return;
            }

            mostrarEstado("Carregando histórico…");
            feedback.textContent = "";
            try {
                if (!window.banco?.from) throw new Error("Cliente Supabase indisponível.");
                const { data: material, error: erroMaterial } = await window.banco
                    .from("estoque")
                    .select("material, quantidade, unidade")
                    .eq("id", estoqueId)
                    .single();
                if (erroMaterial) throw erroMaterial;

                infoMaterial.hidden = false;
                document.getElementById("nomeMaterial").textContent = material.material || "Material sem nome";
                document.getElementById("saldoMaterial").textContent = `Saldo atual: ${material.quantidade ?? 0} ${material.unidade || "un"}`;

                const { data, error } = await window.banco
                    .from("movimentacoes_estoque")
                    .select("id, tipo, quantidade, created_at, responsavel, observacao")
                    .eq("estoque_id", estoqueId)
                    .order("id", { ascending: false });
                if (error) throw error;

                if (!Array.isArray(data) || data.length === 0) {
                    mostrarEstado("Nenhuma movimentação registrada para este material ainda.");
                    return;
                }
                lista.replaceChildren(...data.map(criarLinhaLog));
            } catch (erro) {
                console.error("Erro ao carregar o histórico do estoque:", erro);
                mostrarEstado("Não foi possível carregar o histórico.");
                feedback.textContent = "Verifique a conexão e confirme se a tabela movimentacoes_estoque está configurada no Supabase.";
                feedback.className = "erp-stock-feedback is-error";
            }
        }

        carregarLogs();
    </script>
</body>
</html>
