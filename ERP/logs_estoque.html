<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logs de Estoque - SmartInspect AI</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body class="erp-page--logs-estoque">

<div class="menu-container"></div>

<main class="content">
    <header class="page-header">
        <div>
            <p class="eyebrow">HISTÓRICO DE MOVIMENTAÇÕES</p>
            <h1>📋 Histórico do Material</h1>
            <p class="subtitle">Acompanhe todas as entradas e saídas deste item.</p>
        </div>
        <a href="estoque.html" class="secondary-button logs-back-link">← Voltar ao Estoque</a>
    </header>

    <div id="infoMaterial" class="card stock-material-info" hidden>
        <h2 id="nomeMaterial" class="stock-material-title"></h2>
        <p id="saldoMaterial"></p>
    </div>

    <div id="listaLogs" class="card">
        <p>⏳ Carregando histórico...</p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/sidebar.js"></script>

<script>
    const parametros = new URLSearchParams(window.location.search);
    const estoqueId = parametros.get("id");
    const lista = document.getElementById("listaLogs");
    const infoMaterial = document.getElementById("infoMaterial");

    async function carregarLogs() {
        if (!estoqueId) {
            lista.innerHTML = "<p>❌ Nenhum material selecionado.</p>";
            return;
        }

        const { data: material } = await banco.from("estoque").select("material, quantidade, unidade").eq("id", estoqueId).single();
        
        if (material) {
            infoMaterial.hidden = false;
            document.getElementById("nomeMaterial").textContent = `📦 ${material.material}`;
            document.getElementById("saldoMaterial").textContent = `Saldo atual: ${material.quantidade} ${material.unidade || 'un'}`;
        }

        const { data, error } = await banco
            .from("movimentacoes_estoque")
            .select("*")
            .eq("estoque_id", estoqueId)
            .order("id", { ascending: false });

        if (error) {
            lista.innerHTML = `
                <p>⚠️ Não foi possível carregar os logs.</p>
                <p class="erp-help-note">Verifique se a tabela <strong>movimentacoes_estoque</strong> existe no seu Supabase.</p>
            `;
            return;
        }

        if (!data || data.length === 0) {
            lista.innerHTML = "<p>📭 Nenhuma movimentação registrada para este material ainda.</p>";
            return;
        }

        lista.innerHTML = "";
        data.forEach(log => {
            const tipoClass = log.tipo === 'entrada' ? 'entrada' : 'saida';
            const icone = log.tipo === 'entrada' ? '🟢 Entrada' : '🔴 Saída';
            
            lista.innerHTML += `
                <div class="stock-log-row">
                    <strong class="stock-log-type stock-log-type--${tipoClass}">${icone}</strong>
                    <p class="stock-log-copy"><strong>Quantidade:</strong> ${log.quantidade}</p>
                    <p><strong>Data:</strong> ${new Date(log.created_at || Date.now()).toLocaleString('pt-BR')}</p>
                    <p><strong>Responsável:</strong> ${log.responsavel || 'Não informado'}</p>
                    ${log.observacao ? `<p><strong>Obs:</strong> ${log.observacao}</p>` : ''}
                </div>
            `;
        });
    }

    carregarLogs();
</script>
</body>
</html>
