<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nova senha - SmartInspect AI</title>

<link rel="stylesheet" href="../css/style.css">



</head>


<body class="erp-page--nova-senha">


<div class="login-background">


<div class="login-card">


<img
src="../imagens/logo.png"
class="login-logo"
alt="SmartInspect AI"
>


<h1>
🔐 Nova senha
</h1>


<p>

Crie uma nova senha para acessar
o SmartInspect AI.

</p>


<label>
Nova senha
</label>

<input
id="novaSenha"
type="password"
placeholder="Digite sua nova senha"
autocomplete="new-password"
>


<label>
Confirmar nova senha
</label>

<input
id="confirmarSenha"
type="password"
placeholder="Digite novamente"
autocomplete="new-password"
>


<button
id="btnAlterar"
onclick="alterarSenha()"
>

🔐 Alterar senha

</button>


<p id="mensagem"></p>


<a
class="voltar"
href="login.html"
>
← Voltar para o login
</a>


</div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>


<script>


/* =====================================================
   ALTERAR SENHA
===================================================== */

async function alterarSenha(){


const senha =
document
.getElementById("novaSenha")
.value;


const confirmar =
document
.getElementById("confirmarSenha")
.value;


const mensagem =
document
.getElementById("mensagem");


const botao =
document
.getElementById("btnAlterar");


/* VALIDAR */

if(!senha || !confirmar){

mensagem.innerHTML =
"⚠️ Preencha os dois campos.";

mensagem.className="erro";

return;

}


/* TAMANHO */

if(senha.length < 6){

mensagem.innerHTML =
"⚠️ A senha deve ter pelo menos 6 caracteres.";

mensagem.className="erro";

return;

}


/* CONFIRMAÇÃO */

if(senha !== confirmar){

mensagem.innerHTML =
"❌ As senhas não são iguais.";

mensagem.className="erro";

return;

}


/* BOTÃO */

botao.disabled=true;

botao.innerHTML="⏳ Alterando...";


/* ALTERAR NO SUPABASE */

const {data,error} =
await banco.auth.updateUser({

password:senha

});


/* ERRO */

if(error){

console.error(error);

mensagem.innerHTML =
"❌ Não foi possível alterar a senha.";

mensagem.className="erro";

botao.disabled=false;

botao.innerHTML="🔐 Alterar senha";

return;

}


/* SUCESSO */

mensagem.innerHTML =
"✅ Senha alterada com sucesso!";

mensagem.className="sucesso";


/* SAIR DA SESSÃO */

await banco.auth.signOut();


/* VOLTAR PARA LOGIN */

setTimeout(()=>{

window.location.href="login.html";

},2000);


}


/* =====================================================
   VERIFICAR SESSÃO DE RECUPERAÇÃO
===================================================== */

banco.auth.getSession().then(({data})=>{

if(!data.session){

console.log(
"Nenhuma sessão de recuperação encontrada."
);

}

});


</script>


</body>

</html>
