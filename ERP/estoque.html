<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque - SmartInspect AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="menu-container"></div>

<main class="content">
    <header class="page-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
        <div>
            <p class="eyebrow">CONTROLE DE MATERIAIS</p>
            <h1>📦 Estoque</h1>
            <p class="subtitle">Controle de materiais, quantidades e movimentações da obra.</p>
        </div>
        
        <!-- BOTÃO GIGANTE COM ESTILO DIRETO NA TAG -->
        <button onclick="location.href='novo_estoque.html'" style="background-color: #1268d5; color: white; font-size: 16px; font-weight: bold; padding: 15px 25px; border: none; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.2s;">
            ➕ Novo Material
        </button>
    </header>

    <div id="listaEstoque" style="margin-top: 30px;">
        <div class="card">Carregando estoque...</div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/sidebar.js"></script>

<script>
    const $ = id => document.getElementById(id);

    async function carregarEstoque(){
        const lista = $("listaEstoque");
        lista.innerHTML = `<div class="card">⏳ Carregando estoque...</div>`;

        const {data,error} = await banco.from("estoque").select(`*, obras(nome)`).order("id",{ascending:false});

        if(error){
            lista.innerHTML = `<div class="card">❌ Erro ao carregar estoque.<br>${error.message}</div>`;
            return;
        }

        if(!data || data.length === 0){
            lista.innerHTML = `<div class="card" style="text-align: center; padding: 40px;">
                <h3>📦 Nenhum material cadastrado.</h3>
                <br>
                <button onclick="location.href='novo_estoque.html'" style="background-color: #1268d5; color: white; font-size: 16px; font-weight: bold; padding: 15px 25px; border: none; border-radius: 8px; cursor: pointer;">
                    ➕ Cadastrar meu primeiro material
                </button>
            </div>`;
            return;
        }

        lista.innerHTML = "";

        data.forEach(item => {
            const quantidade = Number(item.quantidade || 0);
            const minimo = Number(item.estoque_minimo || 0);
            let statusEstoque = "🟢 Disponível";
            if(quantidade <= 0) statusEstoque = "🔴 Sem estoque";
            else if(minimo > 0 && quantidade <= minimo) statusEstoque = "🟠 Estoque baixo";

            const unidade = item.unidade || "un";
            const dataEntrada = item.data_entrada ? new Date(item.data_entrada + "T00:00:00").toLocaleDateString("pt-BR") : "Não informada";
            const obra = item.obras?.nome || "Obra não informada";
            const responsavel = item.responsavel || "Não informado";

            lista.innerHTML += `
            <div class="card estoque-card" style="margin-bottom: 20px;">
                <div class="estoque-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <div><h2>📦 ${item.material || "Material sem nome"}</h2><p>${statusEstoque}</p></div>
                    <div><strong style="font-size: 24px; color: #1268d5;">${quantidade} ${unidade}</strong></div>
                </div>
                <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
                <p>🏢 <strong>Obra:</strong> ${obra}</p>
                <p>🔢 <strong>Quantidade:</strong> ${quantidade} ${unidade}</p>
                <p>⚠️ <strong>Estoque mínimo:</strong> ${minimo || "Não definido"}</p>
                <p>📅 <strong>Entrada:</strong> ${dataEntrada}</p>
                <p>👤 <strong>Responsável:</strong> ${responsavel}</p>
                <p>📌 <strong>Status:</strong> ${item.status || "Disponível"}</p>
                
                <div class="estoque-actions" style="margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button onclick="window.location.href='movimentar_estoque.html?id=${item.id}'" style="background: #eaf3ff; color: #1268d5; padding: 10px 15px; border: 1px solid #b9d4f3; border-radius: 6px; cursor: pointer;">🔄 Movimentar</button>
                    <button onclick="window.location.href='novo_estoque.html?id=${item.id}'" style="background: #fff; color: #333; padding: 10px 15px; border: 1px solid #ccc; border-radius: 6px; cursor: pointer;">✏️ Editar</button>
                    <button onclick="window.location.href='logs_estoque.html?id=${item.id}'" style="background: #fff; color: #333; padding: 10px 15px; border: 1px solid #ccc; border-radius: 6px; cursor: pointer;">📋 Logs</button>
                    <button onclick="excluirMaterial(${item.id})" style="background: #fff0ef; color: #c53b3b; padding: 10px 15px; border: 1px solid #ffcccc; border-radius: 6px; cursor: pointer;">🗑 Excluir</button>
                </div>
            </div>`;
        });
    }

    async function excluirMaterial(id){
        if(!confirm("Deseja realmente excluir este material?")) return;
        const {error} = await banco.from("estoque").delete().eq("id",id);
        if(error){ alert("❌ Não foi possível excluir o material."); return; }
        alert("✅ Material removido com sucesso.");
        carregarEstoque();
    }

    carregarEstoque();
</script>

</body>
</html>
