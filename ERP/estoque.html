<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logs de Estoque - SmartInspect AI</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="menu-container"></div>

<main class="content">
    <header class="page-header">
        <div>
            <p class="eyebrow">HISTÓRICO DE MOVIMENTAÇÕES</p>
            <h1>📋 Histórico do Material</h1>
            <p class="subtitle">Acompanhe todas as entradas e saídas deste item.</p>
        </div>
        <a href="estoque.html" class="secondary-button" style="text-decoration:none; padding: 10px 15px; background: #eee; border-radius: 8px; color: #333;">← Voltar ao Estoque</a>
    </header>

    <div id="infoMaterial" class="card" style="margin-bottom: 20px; display: none;">
        <h2 id="nomeMaterial" style="margin-bottom: 10px;"></h2>
        <p id="saldoMaterial"></p>
    </div>

    <div id="listaLogs" class="card">
        <p>⏳ Carregando histórico...</p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/sidebar.js"></script>

<script>
    const parametros = new URLSearchParams(window.location.search);
    const estoqueId = parametros.get("id");
    const lista = document.getElementById("listaLogs");
    const infoMaterial = document.getElementById("infoMaterial");

    async function carregarLogs() {
        if (!estoqueId) {
            lista.innerHTML = "<p>❌ Nenhum material selecionado.</p>";
            return;
        }

        // 1. Busca o nome e a quantidade atual do material
        const { data: material } = await banco.from("estoque").select("material, quantidade, unidade").eq("id", estoqueId).single();
        
        if (material) {
            infoMaterial.style.display = "block";
            document.getElementById("nomeMaterial").textContent = `📦 ${material.material}`;
            document.getElementById("saldoMaterial").textContent = `Saldo atual: ${material.quantidade} ${material.unidade || 'un'}`;
        }

        // 2. Busca os logs
        const { data, error } = await banco
            .from("movimentacoes_estoque")
            .select("*")
            .eq("estoque_id", estoqueId)
            .order("id", { ascending: false });

        if (error) {
            lista.innerHTML = `
                <p>⚠️ Não foi possível carregar os logs.</p>
                <p style="font-size:12px; color:#666;">Verifique se a tabela <strong>movimentacoes_estoque</strong> existe no seu Supabase.</p>
            `;
            return;
        }

        if (!data || data.length === 0) {
            lista.innerHTML = "<p>📭 Nenhuma movimentação registrada para este material ainda.</p>";
            return;
        }

        lista.innerHTML = "";
        data.forEach(log => {
            const cor = log.tipo === 'entrada' ? '#16a36a' : '#c53b3b';
            const icone = log.tipo === 'entrada' ? '🟢 Entrada' : '🔴 Saída';
            
            lista.innerHTML += `
                <div style="border-bottom: 1px solid #eee; padding: 15px 0;">
                    <strong style="color: ${cor}; font-size: 16px;">${icone}</strong>
                    <p style="margin-top: 5px;"><strong>Quantidade:</strong> ${log.quantidade}</p>
                    <p><strong>Data:</strong> ${new Date(log.created_at || Date.now()).toLocaleString('pt-BR')}</p>
                    <p><strong>Responsável:</strong> ${log.responsavel || 'Não informado'}</p>
                    ${log.observacao ? `<p><strong>Obs:</strong> ${log.observacao}</p>` : ''}
                </div>
            `;
        });
    }

    carregarLogs();
</script>
</body>
</html>
