<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Falar com Suporte - SmartInspect AI</title>

<link rel="stylesheet" href="../css/style.css">



</head>

<body class="erp-page--suporte">
<div class="menu-container"></div>


<!-- SIDEBAR -->


<!-- CONTEÚDO -->
<div class="conteudo-suporte">
    <div class="titulo-suporte">
        <h1>💬 Falar com suporte</h1>
        <p>Converse diretamente com a equipe do SmartInspect AI.</p>
    </div>

    <div id="conteudo" class="card-suporte">
        <div class="support-state">
            ⏳ Carregando...
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>

<script>
let usuarioAtual = null;
let chamadoAtual = null;
let canalRealtime = null;

function escapar(texto){
    return String(texto || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function dataBR(data){
    if(!data) return "";
    return new Date(data).toLocaleString("pt-BR");
}

function aviso(texto){
    const div = document.createElement("div");
    div.className="aviso";
    div.textContent=texto;
    document.body.appendChild(div);
    setTimeout(()=>div.remove(), 4000);
}

async function obterUsuario(){
    const { data, error } = await banco.auth.getUser();
    if(error || !data.user){ return null; }
    return data.user;
}

async function carregar(){
    usuarioAtual = await obterUsuario();
    if(!usuarioAtual){
        // Se não estiver logado, volta pro painel
        window.location.href="../painel-pessoal.html";
        return;
    }

    const { data, error } = await banco
        .from("solicitacoes_suporte")
        .select("*")
        .eq("email", usuarioAtual.email)
        .neq("status", "resolvido")
        .order("data_criacao", { ascending:false })
        .limit(1)
        .maybeSingle();

    if(error){
        console.error(error);
        mostrarErro(error.message);
        return;
    }

    if(data){
        chamadoAtual=data;
        mostrarChat();
        carregarMensagens();
        iniciarRealtime();
    }else{
        mostrarCriar();
    }
}

function mostrarCriar(){
    document.getElementById("conteudo").innerHTML=`
        <div class="criar-atendimento">
            <h2>🆕 Criar novo atendimento</h2>
            <p class="support-helper">Envie sua dúvida ou problema para nossa equipe.</p>
            <div class="form-grupo">
                <label>Assunto</label>
                <input id="assunto" type="text" placeholder="Ex: Problema no relatório">
            </div>
            <div class="form-grupo">
                <label>Mensagem</label>
                <textarea id="mensagemInicial" placeholder="Descreva o que aconteceu..."></textarea>
            </div>
            <button id="btnCriar" class="btn-criar" onclick="criarAtendimento()">📨 Abrir Atendimento</button>
        </div>
    `;
}

async function criarAtendimento(){
    const assunto = document.getElementById("assunto").value.trim();
    const mensagem = document.getElementById("mensagemInicial").value.trim();
    const botao = document.getElementById("btnCriar");

    if(!assunto){ aviso("⚠️ Informe o assunto."); return; }
    if(!mensagem){ aviso("⚠️ Informe a mensagem."); return; }

    botao.disabled=true;
    botao.textContent="⏳ Criando...";

    const { data, error } = await banco
        .from("solicitacoes_suporte")
        .insert({
            nome: usuarioAtual.user_metadata?.nome || usuarioAtual.email,
            email: usuarioAtual.email,
            assunto: assunto,
            mensagem: mensagem,
            status: "pendente",
            lido_adm: false
        })
        .select()
        .single();

    if(error){
        console.error(error);
        aviso("❌ Erro: " + error.message);
        botao.disabled=false;
        botao.textContent="📨 Abrir Atendimento";
        return;
    }

    chamadoAtual=data;
    aviso("✅ Atendimento criado!");
    mostrarChat();
    carregarMensagens();
    iniciarRealtime();
}

function mostrarChat(){
    const status = chamadoAtual.status || "pendente";
    let textoStatus="🟡 Pendente";
    if(status==="atendimento") textoStatus="🔵 Em atendimento";
    if(status==="resolvido") textoStatus="🟢 Resolvido";

    document.getElementById("conteudo").innerHTML=`
        <div class="info-chamado">
            <div>
                <h2>${escapar(chamadoAtual.assunto)}</h2>
                <p>📧 ${escapar(chamadoAtual.email)} • ${dataBR(chamadoAtual.data_criacao)}</p>
            </div>
            <span id="status" class="status status-${status}">${textoStatus}</span>
        </div>

        <div class="chat">
            <div id="mensagens" class="mensagens">⏳ Carregando...</div>
            ${status !== "resolvido" 
                ? `<div class="area-envio">
                    <label class="btn-arquivo">📎<input id="arquivo" class="input-arquivo" type="file"></label>
                    <textarea id="resposta" placeholder="Digite sua mensagem..."></textarea>
                    <button class="btn-enviar" id="btnEnviar" onclick="enviarMensagem()">📨 Enviar</button>
                   </div>`
                : `<div class="chamado-resolvido">✅ Este atendimento foi resolvido.</div>`
            }
        </div>
    `;

    const campo = document.getElementById("resposta");
    if(campo){
        campo.addEventListener("keydown", function(event){
            if(event.key==="Enter" && !event.shiftKey){
                event.preventDefault();
                enviarMensagem();
            }
        });
    }

    const arquivo = document.getElementById("arquivo");
    if(arquivo){ arquivo.addEventListener("change", enviarArquivo); }
}

async function carregarMensagens(){
    if(!chamadoAtual) return;
    const area = document.getElementById("mensagens");
    if(!area) return;
    area.innerHTML="";

    adicionarMensagem({
        id:"original",
        chamado_id: chamadoAtual.id,
        mensagem: chamadoAtual.mensagem,
        remetente_tipo: "usuario",
        data_criacao: chamadoAtual.data_criacao
    });

    const { data, error } = await banco
        .from("suporte_mensagens")
        .select("*")
        .eq("chamado_id", chamadoAtual.id)
        .order("data_criacao", { ascending:true });

    if(error){ console.error(error); return; }
    if(data){ data.forEach(adicionarMensagem); }
    rolarChat();
}

function adicionarMensagem(msg){
    const area = document.getElementById("mensagens");
    if(!area) return;
    if(msg.id && area.querySelector(`[data-id="${msg.id}"]`)){ return; }

    const div = document.createElement("div");
    const adm = msg.remetente_tipo==="adm";
    div.className = "mensagem " + (adm ? "adm":"usuario");
    if(msg.id){ div.dataset.id=msg.id; }

    div.innerHTML=`
        ${escapar(msg.mensagem)}
        <small>${adm ? "🛠️ Suporte" : "👤 Você"} • ${dataBR(msg.data_criacao)}</small>
    `;

    area.appendChild(div);
    rolarChat();
}

async function enviarMensagem(){
    if(!chamadoAtual) return;
    const campo = document.getElementById("resposta");
    const botao = document.getElementById("btnEnviar");
    const texto = campo.value.trim();

    if(!texto) return;

    botao.disabled=true;
    botao.textContent="⏳";

    const { error } = await banco
        .from("suporte_mensagens")
        .insert({
            chamado_id: chamadoAtual.id,
            remetente_tipo: "usuario",
            remetente_id: usuarioAtual.id,
            mensagem: texto,
            tipo: "texto"
        });

    if(error){
        console.error(error);
        aviso("❌ " + error.message);
    }else{
        campo.value="";
    }

    botao.disabled=false;
    botao.textContent="📨 Enviar";
}

async function enviarArquivo(){
    const input = document.getElementById("arquivo");
    const arquivo = input?.files?.[0];
    if(!arquivo || !chamadoAtual) return;

    const nome = Date.now() + "_" + arquivo.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const caminho = chamadoAtual.id + "/" + nome;

    aviso("⏳ Enviando arquivo...");

    const { error } = await banco.storage.from("suporte").upload(caminho, arquivo);

    if(error){
        console.error(error);
        aviso("❌ " + error.message);
        input.value="";
        return;
    }

    const { data:urlData } = banco.storage.from("suporte").getPublicUrl(caminho);

    const { data, error:erroMensagem } = await banco
        .from("suporte_mensagens")
        .insert({
            chamado_id: chamadoAtual.id,
            remetente_tipo: "usuario",
            remetente_id: usuarioAtual.id,
            mensagem: "📎 " + arquivo.name,
            tipo: "arquivo",
            url: urlData.publicUrl
        })
        .select()
        .single();

    if(erroMensagem){
        console.error(erroMensagem);
        aviso("❌ Erro ao salvar arquivo.");
        input.value="";
        return;
    }

    aviso("✅ Arquivo enviado!");
    input.value="";
}

function iniciarRealtime(){
    if(!chamadoAtual) return;
    if(canalRealtime){ banco.removeChannel(canalRealtime); }

    canalRealtime = banco
        .channel("usuario-atendimento-" + chamadoAtual.id)
        .on("postgres_changes", { event:"INSERT", schema:"public", table:"suporte_mensagens", filter: "chamado_id=eq." + chamadoAtual.id }, payload => {
            adicionarMensagem(payload.new);
            if(payload.new.remetente_tipo==="adm"){ aviso("💬 Nova resposta do suporte!"); }
        })
        .on("postgres_changes", { event:"UPDATE", schema:"public", table:"solicitacoes_suporte", filter: "id=eq." + chamadoAtual.id }, payload => {
            chamadoAtual = payload.new;
            mostrarChat();
            carregarMensagens();
        })
        .subscribe(status => { console.log("Realtime:", status); });
}

function rolarChat(){
    const area = document.getElementById("mensagens");
    if(!area) return;
    setTimeout(()=>{ area.scrollTop = area.scrollHeight; }, 50);
}

function mostrarErro(erro){
    document.getElementById("conteudo").innerHTML=`
        <div class="support-state support-state--error">
            ❌ Não foi possível carregar o suporte.
            <br><br>
            ${escapar(erro)}
        </div>
    `;
}

async function sair(){
    if(canalRealtime){ await banco.removeChannel(canalRealtime); }
    await banco.auth.signOut();
    localStorage.removeItem("usuario");
    window.location.href = "../painel-pessoal.html";
}

carregar();
</script>


<script src="../js/sidebar.js"></script>
</body>
</html>
