<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin - SmartInspect AI</title>

<link rel="stylesheet" href="../css/style.css">

</head>


<body class="erp-page--admin">
<div class="menu-container"></div>



<div class="content">


<h1>👑 Painel Administrativo</h1>

<p>Aprovação de usuários</p>



<div class="card">


<h2>⏳ Solicitações pendentes</h2>


<div id="usuarios">

Carregando usuários...

</div>


</div>


</div>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../js/supabase.js"></script>



<script>



async function carregarUsuarios(){



const {data,error}=await banco

.from("usuarios")

.select("*")

.eq("status","pendente");





if(error){


console.log(error);


document.getElementById("usuarios").innerHTML =

"❌ Erro ao carregar usuários";


return;


}






if(data.length === 0){


document.getElementById("usuarios").innerHTML =

"✅ Nenhuma solicitação pendente";


return;


}






let html="";






data.forEach(usuario=>{



html += `



<div class="card">



<h3>
${usuario.nome}
</h3>



<p>
📧 ${usuario.email}
</p>




<p>
Cargo solicitado:
<b>${usuario.nivel_acesso}</b>
</p>





<label>
Escolher cargo:
</label>



<select id="nivel_${usuario.id}">


<option value="admin">
👑 Administrador
</option>


<option value="engenheiro">
👷 Engenheiro / Arquiteto / Técnico
</option>


<option value="inspetor">
🔍 Inspetor
</option>


<option value="campo">
📷 Usuário Campo
</option>



</select>





<br><br>





<button onclick="aprovar('${usuario.id}')">

✅ Aprovar

</button>





<button onclick="recusar('${usuario.id}')">

❌ Recusar

</button>



</div>



`;



});






document.getElementById("usuarios").innerHTML = html;



}









async function aprovar(id){



const nivel =

document.getElementById("nivel_"+id).value;





const {error}=await banco

.from("usuarios")

.update({


status:"ativo",


nivel_acesso:nivel


})

.eq("id",id);







if(error){


alert("Erro: "+error.message);


return;


}





alert("✅ Usuário aprovado!");



carregarUsuarios();



}









async function recusar(id){



const {error}=await banco

.from("usuarios")

.update({


status:"recusado"


})

.eq("id",id);







if(error){


alert("Erro: "+error.message);


return;


}





alert("❌ Usuário recusado!");



carregarUsuarios();



}







carregarUsuarios();



</script>



<script src="../js/configuracoes.js"></script>


<script src="../js/sidebar.js"></script>
</body>

</html>
