<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Obra - SmartInspect AI</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="erp-page--nova-obra">

<!-- O MENU VAI CARREGAR AQUI -->
<div class="menu-container"></div>

<div class="content">

    <h1>🏢 Nova Obra</h1>
    <p>Cadastro de uma nova obra</p>

    <div class="card">

        <label>🏢 Nome da Obra</label>
        <input id="nome" type="text" placeholder="Ex: Residencial Alpha">

        <label>📍 Endereço</label>
        <input id="endereco" type="text" placeholder="Rua, número, cidade">

        <label>👷 Responsável Técnico</label>
        <input id="responsavel" type="text" placeholder="Nome do engenheiro/técnico">

        <label>📅 Data de Início</label>
        <input id="data_inicio" type="date">

        <label>📌 Status</label>
        <select id="status">
            <option value="Planejamento">Planejamento</option>
            <option value="Em andamento">Em andamento</option>
            <option value="Finalizada">Finalizada</option>
        </select>

        <br><br>
        <button onclick="salvarObra()">💾 Salvar Obra</button>
        <p id="mensagem"></p>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<!-- SCRIPT DO MENU DE VOLTA -->
<script src="../js/sidebar.js"></script>

<script>
    async function salvarObra(){
        const nome = document.getElementById("nome").value.trim();
        const endereco = document.getElementById("endereco").value.trim();
        const responsavel = document.getElementById("responsavel").value.trim();
        const data_inicio = document.getElementById("data_inicio").value;
        const status = document.getElementById("status").value;

        if(!nome){
            alert("Digite o nome da obra");
            return;
        }

        // Pega o usuário logado no SEU sistema novo (Supabase)
        const { data: { user } } = await banco.auth.getUser();

        const {error}=await banco
        .from("obras")
        .insert([{
            nome: nome,
            endereco: endereco,
            responsavel: responsavel,
            data_inicio: data_inicio,
            status: status,
            criado_por: user ? user.id : null
        }]);

        if(error){
            console.log(error);
            document.getElementById("mensagem").innerHTML = "❌ Erro ao cadastrar: " + error.message;
            return;
        }

        document.getElementById("mensagem").innerHTML = "✅ Obra cadastrada com sucesso!";

        setTimeout(()=>{
            window.location.href="obras.html";
        },1000);
    }
</script>

<footer class="rodape">
    <p>🚀 SmartInspect AI</p>
    <p>Desenvolvido por <strong>Sérgio and Gabriel</strong></p>
    <p>Versão 1.0.1</p>
</footer>

</body>
</html>
