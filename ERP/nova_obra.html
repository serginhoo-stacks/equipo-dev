<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastre uma nova obra no SmartInspect AI.">
    <title>Nova obra - SmartInspect AI</title>

    <!-- Fonte e identidade visual compartilhada do ERP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" type="image/png" href="../imagens/favicon.png">
</head>
<body class="erp-page--obras">
    <!-- O menu lateral é carregado pelo script compartilhado do ERP -->
    <div class="menu-container"></div>

    <main class="content obras-module">
        <!-- CABEÇALHO DA PÁGINA -->
        <header class="obras-heading">
            <div class="obras-title-lockup">
                <span class="obra-card-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 10h1m4 0h1m-6 4h1m4 0h1m-5 7v-4h4v4"></path></svg>
                </span>
                <div>
                    <p class="obras-kicker">GESTÃO DE OBRAS</p>
                    <h1>Nova obra</h1>
                    <p class="obras-intro">Informe os dados principais para cadastrar uma obra no sistema.</p>
                </div>
            </div>
        </header>

        <!-- FORMULÁRIO DE CADASTRO -->
        <form id="formNovaObra" class="card obras-form">
            <label for="nome"><svg class="obras-field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 10h1m4 0h1m-6 4h1m4 0h1m-5 7v-4h4v4"></path></svg>Nome da obra <span class="obras-field-hint">Obrigatório</span></label>
            <input id="nome" name="nome" type="text" maxlength="160" placeholder="Ex.: Residencial Alpha" autocomplete="organization-title" required>

            <label for="endereco"><svg class="obras-field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>Endereço <span class="obras-field-hint">Opcional</span></label>
            <input id="endereco" name="endereco" type="text" maxlength="240" placeholder="Rua, número e cidade" autocomplete="street-address">

            <label for="responsavel"><svg class="obras-field-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21a8 8 0 0 0-16 0M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"></path></svg>Responsável técnico <span class="obras-field-hint">Opcional</span></label>
            <input id="responsavel" name="responsavel" type="text" maxlength="160" placeholder="Nome do engenheiro ou técnico">

            <label for="data_inicio"><svg class="obras-field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M16 3v4M8 3v4M3 11h18"></path></svg>Data de início <span class="obras-field-hint">Opcional</span></label>
            <input id="data_inicio" name="data_inicio" type="date">

            <label for="status"><svg class="obras-field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 2.5 2.5L16 9"></path></svg>Status</label>
            <select id="status" name="status" required>
                <option value="Planejamento">Planejamento</option>
                <option value="Em andamento">Em andamento</option>
                <option value="Finalizada">Finalizada</option>
            </select>

            <div class="obras-form-actions">
                <button id="btnSalvarObra" class="obras-primary-button" type="submit">
                    <svg class="obras-button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12l4 4v14H3V3h2Zm2 0v6h10V3M7 21v-8h10v8"></path></svg>
                    <span>Salvar obra</span>
                </button>
                <button id="btnVoltarObras" class="obras-secondary-button" type="button">
                    <svg class="obras-button-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h12"></path></svg>
                    <span>Voltar às obras</span>
                </button>
            </div>

            <p id="mensagem" class="obras-feedback" role="status" aria-live="polite"></p>
        </form>
    </main>

    <!-- SCRIPTS DO SUPABASE E DO MENU -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/sidebar.js"></script>

    <script>
        "use strict";

        const formNovaObra = document.getElementById("formNovaObra");
        const mensagemObra = document.getElementById("mensagem");
        const botaoSalvar = document.getElementById("btnSalvarObra");

        function mostrarMensagem(texto, tipo = "") {
            mensagemObra.textContent = texto;
            mensagemObra.className = `obras-feedback ${tipo}`.trim();
        }

        document.getElementById("btnVoltarObras").addEventListener("click", () => {
            window.location.href = "obras.html";
        });

        formNovaObra.addEventListener("submit", async (evento) => {
            evento.preventDefault();
            mostrarMensagem("");

            const nome = document.getElementById("nome").value.trim();
            if (!nome) {
                mostrarMensagem("Informe o nome da obra.", "is-error");
                document.getElementById("nome").focus();
                return;
            }

            const cliente = window.banco;
            if (!cliente?.from || !cliente?.auth) {
                mostrarMensagem("Não foi possível conectar ao serviço. Recarregue a página e tente novamente.", "is-error");
                return;
            }

            // A tabela public.obras atual possui somente nome e empresa_id
            // como campos preenchíveis. Os demais dados deste formulário
            // ficam preparados para quando o esquema for ampliado.

            botaoSalvar.disabled = true;
            mostrarMensagem("Salvando obra…");

            try {
                const { error: authError } = await cliente.auth.getUser();
                if (authError) throw authError;
                const empresaId = window.smartInspectCompanyId;
                if (!empresaId) throw new Error("Nenhuma empresa foi selecionada.");

                const { error } = await cliente.from("obras").insert([{
                    nome,
                    empresa_id: empresaId
                }]);

                if (error) throw error;

                mostrarMensagem("Obra cadastrada com sucesso. Voltando à lista…", "is-success");
                window.setTimeout(() => {
                    window.location.href = "obras.html";
                }, 900);
            } catch (erro) {
                console.error("Erro ao cadastrar obra:", erro);
                const detalhe = [erro?.code, erro?.message, erro?.details].filter(Boolean).join(" — ");
                mostrarMensagem(detalhe || "Não foi possível cadastrar a obra. Confira os dados e tente novamente.", "is-error");
                botaoSalvar.disabled = false;
            }
        });
    </script>
</body>
</html>
