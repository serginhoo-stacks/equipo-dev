<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Detalhes da Obra - SmartInspect AI</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="menu-container"></div>



<div class="content">


<button onclick="voltar()">
⬅ Voltar
</button>


<h1>🏢 Detalhes da Obra</h1>

<p>
Informações da obra cadastrada
</p>



<div class="card">


<h2 id="nomeObra">
Carregando...
</h2>


<p>
📍 Endereço:
<span id="endereco"></span>
</p>


<p>
👷 Responsável:
<span id="responsavel"></span>
</p>


<p>
📅 Início:
<span id="data"></span>
</p>


<p>
📌 Status:
<span id="status"></span>
</p>



</div>





<div class="card">


<h2>
📋 Inspeções da Obra
</h2>


<div id="listaInspecoes">

Carregando inspeções...

</div>



</div>



</div>







<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/configuracoes.js"></script>
<script src="js/auth.js"></script>

<script src="js/sidebar.js"></script>




<script>


if(!protegerPagina("obras")){

throw new Error("Sem permissão");

}




const params = new URLSearchParams(window.location.search);


const obraId = params.get("id");






if(!obraId){


alert("Obra não encontrada");


window.location.href="obras.html";


}







async function carregarObra(){



const {data,error}=await banco

.from("obras")

.select("*")

.eq("id",obraId)

.single();






if(error){


console.log(error);


alert("Erro ao carregar obra");


return;


}






document.getElementById("nomeObra").innerHTML =
"🏢 "+data.nome;



document.getElementById("endereco").innerHTML =
data.endereco || "-";



document.getElementById("responsavel").innerHTML =
data.responsavel || "-";



document.getElementById("data").innerHTML =
data.data_inicio || "-";



document.getElementById("status").innerHTML =
data.status || "-";



carregarInspecoes();



}









async function carregarInspecoes(){



const {data,error}=await banco

.from("inspecoes")

.select("*")

.eq("obra_id",obraId)

.order("id",{ascending:false});





const lista =
document.getElementById("listaInspecoes");




if(error){


console.log(error);


lista.innerHTML="Erro ao carregar inspeções";


return;


}





if(!data || data.length===0){


lista.innerHTML=

"Nenhuma inspeção cadastrada nesta obra";


return;


}







lista.innerHTML="";





data.forEach(inspecao=>{



lista.innerHTML += `


<div class="card">


<h3>
📋 ${inspecao.tipo}
</h3>


<p>
📅 ${inspecao.data_inspecao}
</p>


<p>
👷 ${inspecao.responsavel}
</p>


<p>
📌 ${inspecao.status}
</p>


<p>
${inspecao.observacao || ""}
</p>


</div>


`;



});





}







function voltar(){


window.location.href="obras.html";


}






carregarObra();



</script>





<footer class="rodape">

<p>
🚀 SmartInspect AI
</p>

<p>
Desenvolvido por <strong>Sérgio and Gabriel</strong>
</p>

<p>
Versão 1.0.1
</p>

</footer>



</body>

</html>
